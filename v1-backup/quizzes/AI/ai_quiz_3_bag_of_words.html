<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Quiz 3: Bag-of-Words &amp; Sparse Matrix | Python NLP Mastery</title>
<meta content="Master NLP fundamentals with 15 questions on Bag-of-Words, Sparse Matrices, and Scikit-learn's CountVectorizer." name="description"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="../../shared/quiz-style.css" rel="stylesheet"/>
<link href="https://faruk-hasan.com/quizzes/AI/ai_quiz_3_bag_of_words.html" rel="canonical"/></head>
<body>
<h1>🤖 Bag-of-Words &amp; NLP Quiz</h1>
<div class="quiz-container">
<a class="back-link" href="../../resources/resources.html"><i class="fas fa-arrow-left"></i> Back to Resources</a>
<div class="intro">
<p>Test your understanding of the Bag-of-Words model and how sparse matrices are used to store text data
        efficiently in Python.</p>
</div>
<div class="progress-wrapper">
<div class="progress-container">
<div id="progress-fill"></div>
</div>
<div id="progress-count">0/15 answered</div>
</div>
<form id="quiz-form">
<div id="quiz-area"></div>
<button id="submitBtn" onclick="submitQuiz()" type="button">Submit Results</button>
</form>
<div id="results">
<div class="score-container">
<div class="score-circle">0</div>
<div class="score-label">Your Score</div>
</div>
<div class="feedback"></div>
<div class="action-buttons">
<a class="secondary-btn" href="" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
<a class="secondary-btn" href="../../resources/resources.html"><i class="fas fa-th-list"></i> More Quizzes</a>
</div>
<div class="answer-key" id="answer-key"></div>
</div>
</div>
<script>
    const questions = [
      { q: "1. What does a 'bag-of-words' model do with a collection of text documents?", options: ["A) It treats each document as a mathematical 'bag' and counts word frequency", "B) It translates words into emojis", "C) It stores full sentences without breaking them", "D) It removes all punctuation and ignores words"], correct: "A" },
      { q: "2. When calling CountVectorizer().fit_transform(documents), what is the returned object type?", options: ["A) A dense Python list", "B) A CSR sparse matrix", "C) A pandas DataFrame", "D) A simple integer"], correct: "B" },
      { q: "3. In sparse coordinate output like (0, 3) 1, what does (0, 3) represent?", options: ["A) (Row Index, Column Index)", "B) (Word Count, Word Index)", "C) (Sentences, Paragraphs)", "D) (Character, Position)"], correct: "A" },
      { q: "4. T/F: A sparse matrix stores every single zero in the grid.", options: ["A) True", "B) False"], correct: "B", explanation: "Sparse matrices only store non-zero values to save memory." },
      { q: "5. What is 'tokenization'?", options: ["A) Encrypting text", "B) Breaking text into individual words or characters", "C) Bolding important words", "D) Translating text"], correct: "B" },
      { q: "6. Which Scikit-learn tool is used to create a Bag-of-Words model?", options: ["A) LinearRegression", "B) CountVectorizer", "C) StandardScaler", "D) KMeans"], correct: "B" },
      { q: "7. Why do we often use sparse matrices in NLP?", options: ["A) Because most cells in a word-document matrix are zeros", "B) Because they are colorful", "C) To make the code harder to read", "D) They are not used in NLP"], correct: "A" },
      { q: "8. T/F: Bag-of-words preserves the order of words in a sentence.", options: ["A) True", "B) False"], correct: "B", explanation: "Order and grammar are lost in a basic BoW model." },
      { q: "9. What happens to the vocabulary size if you add more unique words?", options: ["A) It decreases", "B) It stays the same", "C) It increases", "D) It becomes zero"], correct: "C" },
      { q: "10. What is a 'stop word' in NLP?", options: ["A) Common words like 'the', 'is', 'a' that are often removed", "B) A word that ends a sentence", "C) A typo", "D) A very long word"], correct: "A" },
      { q: "11. If a document has 'cat' twice, what will its value be in the BoW matrix?", options: ["A) 0", "B) 1", "C) 2", "D) 'cat'"], correct: "C" },
      { q: "12. T/F: .toarray() can be used to convert a sparse matrix back to a dense array.", options: ["A) True", "B) False"], correct: "A" },
      { q: "13. What is 'fitting' in CountVectorizer?", options: ["A) Building the vocabulary from the documents", "B) Compressing the file", "C) Training a neural network", "D) Sorting the text"], correct: "A" },
      { q: "14. What does 'transforming' do in CountVectorizer?", options: ["A) Changing the font", "B) Converting documents to word-count vectors based on vocabulary", "C) Translating to Spanish", "D) Deleting the data"], correct: "B" },
      { q: "15. Which character usually separates the coordinates in a sparse matrix representation?", options: ["A) Comma", "B) Dash", "C) Space", "D) Semicolon"], correct: "A" }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation || ''}</em></p>
        </div>`;
      });
      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
