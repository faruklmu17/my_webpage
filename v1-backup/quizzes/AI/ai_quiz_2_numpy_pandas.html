<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Quiz 2: NumPy &amp; Pandas | Data Science Mastery</title>
<meta content="Test your Python data science skills with 15 questions on NumPy arrays, Pandas DataFrames, and data cleaning techniques." name="description"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="../../shared/quiz-style.css" rel="stylesheet"/>
<link href="https://faruk-hasan.com/quizzes/AI/ai_quiz_2_numpy_pandas.html" rel="canonical"/></head>
<body>
<h1>📊 NumPy &amp; Pandas Mastery Quiz</h1>
<div class="quiz-container">
<a class="back-link" href="../../resources/resources.html"><i class="fas fa-arrow-left"></i> Back to Resources</a>
<div class="intro">
<p>Master the essentials of data manipulation in Python. This quiz covers NumPy indexing, Pandas DataFrames,
        handling missing values, and more.</p>
</div>
<div class="progress-wrapper">
<div class="progress-container">
<div id="progress-fill"></div>
</div>
<div id="progress-count">0/15 answered</div>
</div>
<form id="quiz-form">
<div id="quiz-area"></div>
<button id="submitBtn" onclick="submitQuiz()" type="button">Submit Results</button>
</form>
<div id="results">
<div class="score-container">
<div class="score-circle">0</div>
<div class="score-label">Your Score</div>
</div>
<div class="feedback"></div>
<div class="action-buttons">
<a class="secondary-btn" href="" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
<a class="secondary-btn" href="../../resources/resources.html"><i class="fas fa-th-list"></i> More Quizzes</a>
</div>
<div class="answer-key" id="answer-key"></div>
</div>
</div>
<script>
    const questions = [
      { q: "1. What is the fundamental object in the NumPy library?", options: ["A) List", "B) ndarray", "C) DataFrame", "D) Scalar"], correct: "B", explanation: "The ndarray (n-dimensional array) is the core of NumPy." },
      { q: "2. Which method is used to create a NumPy array from a list?", options: ["A) np.array()", "B) np.tolist()", "C) np.create()", "D) np.make()"], correct: "A" },
      { q: "3. T/F: Pandas DataFrames are 2-dimensional labeled data structures.", options: ["A) True", "B) False"], correct: "A" },
      { q: "4. Which Pandas method is used to display the first few rows of a DataFrame?", options: ["A) df.show()", "B) df.first()", "C) df.head()", "D) df.print()"], correct: "C" },
      { q: "5. How do you find the shape (dimensions) of a NumPy array 'arr'?", options: ["A) arr.len()", "B) arr.shape", "C) arr.size()", "D) arr.dim"], correct: "B" },
      { q: "6. Which function is used to handle missing values in a Pandas DataFrame by filling them?", options: ["A) df.dropna()", "B) df.fillna()", "C) df.replace()", "D) df.empty()"], correct: "B" },
      { q: "7. T/F: NumPy operations are generally slower than standard Python loops for large datasets.", options: ["A) True", "B) False"], correct: "B", explanation: "NumPy uses vectorization and C-based operations, making it much faster." },
      { q: "8. What does df.describe() provide in Pandas?", options: ["A) Column names", "B) Memory usage", "C) Summary statistics (mean, std, etc.)", "D) Data types"], correct: "C" },
      { q: "9. How do you select a single column named 'Age' from a DataFrame 'df'?", options: ["A) df.select('Age')", "B) df['Age']", "C) df.get('Age')", "D) df.row('Age')"], correct: "B" },
      { q: "10. What does np.zeros((3,3)) create?", options: ["A) A 3x3 array of ones", "B) A list of three zeros", "C) A 3x3 array of zeros", "D) An empty list"], correct: "C" },
      { q: "11. Which Pandas function is used to read a CSV file?", options: ["A) pd.open_csv()", "B) pd.read_csv()", "C) pd.load()", "D) pd.fetch()"], correct: "B" },
      { q: "12. T/F: Pandas is built on top of NumPy.", options: ["A) True", "B) False"], correct: "A" },
      { q: "13. How do you remove rows with missing values in Pandas?", options: ["A) df.remove_null()", "B) df.dropna()", "C) df.delete()", "D) df.clean()"], correct: "B" },
      { q: "14. What is 'Broadcasting' in NumPy?", options: ["A) Sending data over a network", "B) Performing operations on arrays of different shapes", "C) Printing the array", "D) Reshaping the data"], correct: "B" },
      { q: "15. Which method is used to sort a Pandas DataFrame by a column?", options: ["A) df.sort_values()", "B) df.order()", "C) df.rank()", "D) df.arrange()"], correct: "A" }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation || ''}</em></p>
        </div>`;
      });
      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
