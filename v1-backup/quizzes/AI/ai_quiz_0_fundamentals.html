<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Data &amp; Web Scraping Quiz (12 MCQs)</title>
<link href="https://faruk-hasan.com/quizzes/AI/ai_quiz_0_fundamentals.html" rel="canonical"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="../../shared/quiz-style.css" rel="stylesheet"/>
<meta content="Explore 📊 Data &amp; Web Scraping Quiz on Faruk Hasan's portfolio. Interactive resources and programming practice." name="description"/></head>
<body>
<h1>📊 Data &amp; Web Scraping Quiz</h1>
<div class="quiz-container">
<a class="back-link" href="../../resources/resources.html"><i class="fas fa-arrow-left"></i> Back to Resources</a>
<div class="progress-wrapper">
<div class="progress-container">
<div id="progress-fill"></div>
</div>
<div id="progress-count">0/12 answered</div>
</div>
<form id="quiz-form">
<div id="quiz-area"></div>
<button id="submitBtn" onclick="submitQuiz()" type="button">Submit Results</button>
</form>
<div id="results">
<div class="score-container">
<div class="score-circle">0</div>
<div class="score-label">Your Score</div>
</div>
<div class="feedback"></div>
<div class="action-buttons">
<a class="secondary-btn" href="" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
<a class="secondary-btn" href="../../resources/resources.html"><i class="fas fa-th-list"></i> More Quizzes</a>
</div>
<div class="answer-key" id="answer-key"></div>
</div>
</div>
<script>
    const questions = [
      {
        q: "1. What is data in the context of AI?",
        options: [
          "A) Only numbers used for math.",
          "B) Information that a computer can store, process, or analyze to learn and make decisions.",
          "C) The physical hardware inside a computer.",
          "D) A type of computer virus."
        ],
        correct: "B",
        explanation: "Data is information (numbers, text, images, etc.) that serves as the foundation and fuel for AI to learn and make decisions."
      },
      {
        q: "2. Why is data quality important for Artificial Intelligence?",
        options: [
          "A) It makes the computer run faster.",
          "B) Messy or wrong data can cause the AI to make mistakes.",
          "C) High-quality data is cheaper to store.",
          "D) It doesn't matter; AI can fix any data."
        ],
        correct: "B",
        explanation: "The better the data, the smarter the AI becomes. If data is messy or wrong, AI can make mistakes (like a self-driving car misreading a blurry sign)."
      },
      {
        q: "3. What is 'data scraping'?",
        options: [
          "A) The process of deleting old files from a computer.",
          "B) Automatically collecting information from websites on the internet.",
          "C) Drawing pictures on a screen.",
          "D) Upgrading a computer's hardware."
        ],
        correct: "B",
        explanation: "Data scraping acts like a robot gathering information for you from a website, saving you time instead of copying it manually."
      },
      {
        q: "4. Why should you check a website's 'robots.txt' file before scraping?",
        options: [
          "A) To find hidden passwords.",
          "B) To make sure it’s okay and permitted to collect the data from the site.",
          "C) To make the internet connection faster.",
          "D) To translate the website to another language."
        ],
        correct: "B",
        explanation: "Checking robots.txt is like asking for permission to use someone’s things. It tells you what is allowed to be scraped."
      },
      {
        q: "5. What is Google Colab?",
        options: [
          "A) A social media app.",
          "B) A physical laboratory in California.",
          "C) A free, cloud-based coding platform perfect for learning Python without installing software.",
          "D) A web scraping library."
        ],
        correct: "C",
        explanation: "Google Colab is a cloud platform by Google where you can write and run Python code, with files saved directly to Google Drive."
      },
      {
        q: "6. What is the primary purpose of the 'Beautiful Soup' Python library?",
        options: [
          "A) To cook recipes online.",
          "B) To parse HTML files and extract data like titles, links, and text from web pages.",
          "C) To create 3D video games.",
          "D) To send emails automatically."
        ],
        correct: "B",
        explanation: "Beautiful Soup is a Python library specifically designed for web scraping and organizing HTML data so you can extract specific elements."
      },
      {
        q: "7. How does the 'Requests' tool help in web scraping?",
        options: [
          "A) It formats the data into tables.",
          "B) It acts like a messenger that connects to websites and brings back the webpage content (HTML).",
          "C) It translates the webpage into different languages.",
          "D) It generates random numbers."
        ],
        correct: "B",
        explanation: "Requests allows your scraper to 'travel' to websites and fetch data by sending HTTP requests, like a GET request."
      },
      {
        q: "8. What does 'parsing' mean in the context of web scraping?",
        options: [
          "A) Deleting unnecessary websites.",
          "B) Breaking down the structure of a webpage (HTML) into smaller, organized parts that Python can understand.",
          "C) Encrypting the data to make it secure.",
          "D) Printing the data on paper."
        ],
        correct: "B",
        explanation: "Parsing turns a messy webpage into a neat structure, allowing tools like Beautiful Soup to easily find and extract specific elements."
      },
      {
        q: "9. In HTML, what is the <span> tag primarily used for?",
        options: [
          "A) To create large, bold headings.",
          "B) To group inline elements, like text, without affecting the page layout.",
          "C) To display images.",
          "D) To create a new paragraph."
        ],
        correct: "B",
        explanation: "A <span> tag is used to group inline content and helps target specific pieces of text, like a quote, without creating new blocks or lines."
      },
      {
        q: "10. What does the find_all() method do in Beautiful Soup?",
        options: [
          "A) It downloads all images on the page.",
          "B) It searches for all HTML elements that match a specific tag and/or class.",
          "C) It finds all errors in your Python code.",
          "D) It deletes all the text on a website."
        ],
        correct: "B",
        explanation: "find_all() is a method used to find every element that matches your search criteria, such as all <span> tags with a specific class."
      },
      {
        q: "11. In the HTML snippet <span class='text'>, what is the purpose of class='text'?",
        options: [
          "A) A command to make the text bigger.",
          "B) A unique label or identifier given to certain elements so they can be easily targeted by a scraper.",
          "C) The actual quote being scraped.",
          "D) A Python function."
        ],
        correct: "B",
        explanation: "The class attribute acts as an identifier (like targeting just the elements containing quotes) so Beautiful Soup can find exactly what you want."
      },
      {
        q: "12. Which Python module can be used to select a random quote from a list of scraped quotes?",
        options: [
          "A) math",
          "B) requests",
          "C) random",
          "D) beautifulsoup"
        ],
        correct: "C",
        explanation: "The random module, specifically using random.choice(), allows you to easily pick a random item from a list."
      }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';

      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;

        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
      });

      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';

      const percentage = (score / questions.length) * 100;
      let feedbackText = '';
      if (percentage >= 90) feedbackText = 'Excellent! You Have Mastered the Fundamentals.';
      else if (percentage >= 70) feedbackText = 'Good job! You have a solid grasp of these concepts.';
      else feedbackText = 'Keep studying! Data fundamentals are the building blocks of AI.';

      document.querySelector('.feedback').textContent = feedbackText;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
