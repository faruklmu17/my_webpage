<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HTML Web Development Concepts Quiz | 25 Questions</title>
<meta content="Test your web development knowledge with this 25-question quiz covering HTML, CSS, JavaScript, and general web concepts." name="description"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="../../shared/quiz-style.css" rel="stylesheet"/>
<link href="https://faruk-hasan.com/quizzes/HTML-CSS-JS/wd_quiz1.html" rel="canonical"/></head>
<body>
<h1>🌐 Web Development Concepts Quiz</h1>
<div class="quiz-container">
<a class="back-link" href="../../resources/resources.html"><i class="fas fa-arrow-left"></i> Back to
            Resources</a>
<div class="intro">
<p>Test your knowledge of HTML, CSS, JavaScript, and general web fundamentals. How well do you know the
                building blocks of the web?</p>
</div>
<div class="progress-wrapper">
<div class="progress-container">
<div id="progress-fill"></div>
</div>
<div id="progress-count">0/24 answered</div>
</div>
<form id="quiz-form">
<div id="quiz-area"></div>
<button id="submitBtn" onclick="submitQuiz()" type="button">Submit Results</button>
</form>
<div id="results">
<div class="score-container">
<div class="score-circle">0</div>
<div class="score-label">Your Score</div>
</div>
<div class="feedback"></div>
<div class="action-buttons">
<a class="secondary-btn" href="" onclick="location.reload(); return false;"><i class="fas fa-redo"></i>
                    Retake Quiz</a>
<a class="secondary-btn" href="../../resources/resources.html"><i class="fas fa-th-list"></i> More
                    Quizzes</a>
</div>
<div class="answer-key" id="answer-key"></div>
</div>
</div>
<script>
        const questions = [
            { q: "1. What does HTML stand for?", options: ["A) Hyper Text Markup Language", "B) High Tech Multi Language", "C) Hyper Transfer Markup Language", "D) Home Tool Markup Language"], correct: "A", explanation: "HTML is the standard markup language for creating web pages." },
            { q: "2. Which tag is used to create a hyperlink?", options: ["A) <link>", "B) <href>", "C) <a>", "D) <url>"], correct: "C", explanation: "The <a> (anchor) tag is used to define hyperlinks." },
            { q: "3. What is the correct way to add a comment in HTML?", options: ["A) // comment", "B) /* comment */", "C) <!-- comment -->", "D) # comment"], correct: "C", explanation: "HTML comments start with <!-- and end with -->." },
            { q: "4. Which property is used to change the background color in CSS?", options: ["A) color", "B) background-color", "C) bgcolor", "D) fill-color"], correct: "B", explanation: "background-color defines the background color of an element." },
            { q: "5. What does CSS stand for?", options: ["A) Creative Style Sheets", "B) Computer Style Sheets", "C) Cascading Style Sheets", "D) Colorful Style Sheets"], correct: "C", explanation: "CSS stands for Cascading Style Sheets." },
            { q: "6. Which HTML element is used for the largest heading?", options: ["A) <head>", "B) <h6>", "C) <heading>", "D) <h1>"], correct: "D", explanation: "<h1> is the highest level of heading." },
            { q: "7. Which tag is used to define an unordered list?", options: ["A) <ul>", "B) <ol>", "C) <li>", "D) <list>"], correct: "A", explanation: "<ul> creates a bulleted (unordered) list." },
            { q: "8. What is the correct CSS syntax for making all <p> elements bold?", options: ["A) p {font-weight: bold;}", "B) p {text-size: bold;}", "C) p {style: bold;}", "D) <p style='bold'>"], correct: "A", explanation: "font-weight: bold; is the correct property." },
            { q: "9. How do you link an external CSS file to an HTML document?", options: ["A) <style src='style.css'>", "B) <link rel='stylesheet' href='style.css'>", "C) <script href='style.css'>", "D) <css link='style.css'>"], correct: "B", explanation: "The <link> tag in the head section is the standard way." },
            { q: "10. In JavaScript, how do you output data to the browser console?", options: ["A) console.print()", "B) console.log()", "C) print.console()", "D) log.console()"], correct: "B", explanation: "console.log() prints messages to the developer console." },
            { q: "11. Which keyword is used to declare a variable that cannot be reassigned?", options: ["A) var", "B) let", "C) const", "D) static"], correct: "C", explanation: "const declares a constant variable." },
            { q: "12. What does the 'DOM' stand for in web development?", options: ["A) Document Object Model", "B) Data Object Management", "C) Digital Ordinary Model", "D) Document Operating Main"], correct: "A", explanation: "The DOM is a programming interface for web documents." },
            { q: "13. Which of the following is NOT a JavaScript data type?", options: ["A) Number", "B) Boolean", "C) Element", "D) String"], correct: "C", explanation: "Element is a DOM node type, but not a primitive JS data type." },
            { q: "14. What is the default value of the position property in CSS?", options: ["A) relative", "B) absolute", "C) fixed", "D) static"], correct: "D", explanation: "By default, elements are positioned statically." },
            { q: "15. Which character is used to indicate an 'id' selector in CSS?", options: ["A) .", "B) #", "C) *", "D) &"], correct: "B", explanation: "The hash symbol # is used for IDs." },
            { q: "16. Which CSS property controls the text size?", options: ["A) font-style", "B) text-size", "C) font-size", "D) size"], correct: "C", explanation: "font-size is the correct property." },
            { q: "17. What is the total number of columns in the Bootstrap grid system?", options: ["A) 10", "B) 12", "C) 16", "D) 8"], correct: "B", explanation: "Bootstrap uses a 12-column grid." },
            { q: "18. Which HTTP status code means 'Not Found'?", options: ["A) 200", "B) 500", "C) 404", "D) 403"], correct: "C", explanation: "404 is the standard code for missing pages." },
            { q: "19. What is the value of 'a' after: let a = 10 + '5'?", options: ["A) 15", "B) 105", "C) Error", "D) undefined"], correct: "B", explanation: "JavaScript converts the number to a string and concatenates." },
            { q: "20. Which event occurs when a user clicks on an HTML element?", options: ["A) onmouseclick", "B) onchange", "C) onclick", "D) onhover"], correct: "C", explanation: "onclick is the standard event handler." },
            { q: "21. What is 'responsive design'?", options: ["A) Designing for fast loading", "B) Designing for different screen sizes", "C) Designing for accessibility", "D) Designing with animations"], correct: "B", explanation: "Responsive design ensures websites look good on desktops, tablets, and phones." },
            { q: "22. Which HTML5 tag is used to embed video?", options: ["A) <media>", "B) <movie>", "C) <video>", "D) <embed-video>"], correct: "C", explanation: "The <video> tag is native to HTML5." },
            { q: "23. In CSS, what is the space between the content and the border called?", options: ["A) Margin", "B) Padding", "C) Border-spacing", "D) Gutter"], correct: "B", explanation: "Padding is the internal space within an element." },
            { q: "24. What does the JSON.stringify() method do?", options: ["A) Parses a JSON string", "B) Converts a JS object to a JSON string", "C) Checks if a string is JSON", "D) Deletes a JSON object"], correct: "B", explanation: "It serializes a JavaScript object into a string format." }
        ];

        const quizArea = document.getElementById("quiz-area");
        questions.forEach((q, i) => {
            const div = document.createElement("div");
            div.className = "question";
            div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
                q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
                `</div>`;
            quizArea.appendChild(div);
        });

        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
                document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
                document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
            });
        });

        function submitQuiz() {
            let score = 0;
            let html = '<h2>Detailed Results</h2>';
            questions.forEach((q, i) => {
                const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
                const isCorrect = selected && selected.value === q.correct;
                if (isCorrect) score++;
                html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
            });
            document.querySelector('.score-circle').textContent = score + '/' + questions.length;
            document.getElementById('answer-key').innerHTML = html;
            document.getElementById('quiz-form').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
