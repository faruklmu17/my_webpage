<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Careers - Apply for a Job</title>
<link href="styles.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="shared/header-footer.css" rel="stylesheet"/>
<script defer="" src="shared/header-footer.js"></script>
<style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 0;
      color: #333;
    }

    .job-application-container {
      max-width: 800px;
      margin: 80px auto;
      padding: 40px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
    }

    .job-application-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .form-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .form-header h1 {
      font-size: 2.5rem;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .form-header p {
      color: #7f8c8d;
      font-size: 1.1rem;
    }

    .form-group {
      margin-bottom: 25px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #34495e;
      font-size: 0.95rem;
    }

    .form-group input, 
    .form-group select, 
    .form-group textarea {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #e0e6ed;
      border-radius: 12px;
      font-size: 1rem;
      font-family: 'Montserrat', sans-serif;
      transition: all 0.3s ease;
      background-color: #f8fafc;
      box-sizing: border-box;
    }

    .form-group input:focus, 
    .form-group select:focus, 
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .file-upload-wrapper {
      position: relative;
      width: 100%;
      height: 60px;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .file-upload-wrapper:hover {
      border-color: #667eea;
      background-color: #eff6ff;
    }

    .file-upload-wrapper input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .file-upload-text {
      color: #64748b;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      font-family: 'Montserrat', sans-serif;
      margin-top: 10px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .back-link {
      display: inline-block;
      margin-top: 30px;
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .back-link:hover {
      color: #764ba2;
    }

    .success-message {
      display: none;
      padding: 20px;
      background-color: #ecfdf5;
      border-left: 5px solid #10b981;
      border-radius: 8px;
      margin-bottom: 30px;
      color: #065f46;
    }

    .success-message.show {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
<meta content="Explore Join Our Team on Faruk Hasan's portfolio. Interactive resources and programming practice." name="description"/><link href="https://faruk-hasan.com/apply.html" rel="canonical"/></head>
<body>
<div class="job-application-container">
<div class="form-header">
<h1>Join Our Team</h1>
<p>Fill out the form below and we'll be in touch soon.</p>
</div>
<div class="success-message" id="successMessage">
<strong><i class="fas fa-check-circle"></i> Success!</strong> Your application has been submitted successfully. We will review it shortly.
    </div>
<form action="https://formspree.io/f/mdawrday" id="jobApplicationForm" method="POST" onsubmit="submitForm(event)">
<div class="form-group">
<label for="fullName">Full Name</label>
<input id="fullName" name="name" placeholder="John Doe" required="" type="text"/>
</div>
<div class="form-group">
<label for="email">Email Address</label>
<input id="email" name="email" placeholder="john.doe@example.com" required="" type="email"/>
</div>
<div class="form-group">
<label for="phone">Phone Number</label>
<input id="phone" name="phone" placeholder="+1 (555) 000-0000" required="" type="tel"/>
</div>
<div class="form-group">
<label for="role">Desired Role</label>
<select id="role" name="role" required="">
<option disabled="" selected="" value="">Select a position...</option>
<option value="software_engineer">Software QA Engineer</option>
<option value="frontend_dev">Frontend Developer</option>
<option value="backend_dev">Backend Developer</option>
<option value="ai_specialist">AI Specialist</option>
<option value="other">Other</option>
</select>
</div>
<div class="form-group">
<label for="portfolio">Portfolio / LinkedIn / GitHub URL</label>
<input id="portfolio" name="portfolio" placeholder="https://linkedin.com/in/yourprofile" type="url"/>
</div>
<div class="form-group">
<label for="resumeLink">Resume Link (Google Drive, Dropbox, etc.)</label>
<input id="resumeLink" name="resume_link" placeholder="https://docs.google.com/..." required="" type="url"/>
</div>
<div class="form-group">
<label for="coverLetter">Cover Letter (Optional)</label>
<textarea id="coverLetter" name="coverLetter" placeholder="Tell us why you'd be a great fit..."></textarea>
</div>
<button class="submit-btn" id="submitBtn" type="submit">
        Submit Application <i class="fas fa-paper-plane" style="margin-left: 8px;"></i>
</button>
<div style="text-align: center;">
</div>
</form>
</div>
<script>
    async function submitForm(event) {
      event.preventDefault();
      const form = document.getElementById('jobApplicationForm');
      const btn = document.getElementById('submitBtn');
      
      // Show loading state
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
      btn.style.opacity = '0.8';
      btn.style.cursor = 'not-allowed';
      
      try {
        const response = await fetch(form.action, {
          method: form.method,
          body: new FormData(form),
          headers: {
            'Accept': 'application/json'
          }
        });
        
        if (response.ok) {
          form.reset();
          btn.innerHTML = 'Submit Application <i class="fas fa-paper-plane" style="margin-left: 8px;"></i>';
          btn.style.opacity = '1';
          btn.style.cursor = 'pointer';
          
          const successMsg = document.getElementById('successMessage');
          successMsg.classList.add('show');
          
          window.scrollTo({ top: 0, behavior: 'smooth' });
          
          setTimeout(() => {
            successMsg.classList.remove('show');
          }, 5000);
        } else {
          alert('Oops! There was a problem submitting your form');
          btn.innerHTML = 'Submit Application <i class="fas fa-paper-plane" style="margin-left: 8px;"></i>';
          btn.style.opacity = '1';
          btn.style.cursor = 'pointer';
        }
      } catch (error) {
        alert('Oops! There was a problem submitting your form');
        btn.innerHTML = 'Submit Application <i class="fas fa-paper-plane" style="margin-left: 8px;"></i>';
        btn.style.opacity = '1';
        btn.style.cursor = 'pointer';
      }
    }
  </script>
</body>
</html>
