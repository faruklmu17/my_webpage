<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Space Typing Hero - Kids Typing Practice Game</title>
    <meta name="description"
        content="A fun, free space-themed typing game for kids. Help the rocket fly by typing letters correctly! Learn default keys A, B, C, D and Space effectively." />
    <meta name="keywords"
        content="typing game for kids, learn to type, space game, educational game, free typing practice, alphabet game" />
    <meta property="og:title" content="Space Typing Hero - Learn to Type" />
    <meta property="og:description"
        content="Blast off into learning! A fun interactive game to practice keyboard skills." />
    <meta property="og:type" content="website" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Animated Stars Background */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0, 0, 0, 0));
            background-size: 200px 200px;
            animation: starMove 100s linear infinite;
        }

        @keyframes starMove {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 1000px;
            }
        }

        .game-container {
            position: relative;
            z-index: 10;
            width: min(900px, 95%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 30px;
            padding: 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes popIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 42px;
            color: #fbbf24;
            text-shadow: 0 6px 0 #b45309;
            margin: 0 0 10px;
            letter-spacing: 2px;
        }

        p.sub {
            color: #cbd5e1;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }

        .stat-pill.highlight {
            border-color: #fbbf24;
            color: #fbbf24;
        }

        .icon {
            font-size: 20px;
        }

        /* Typing Area */
        .typing-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            padding: 30px 20px;
            margin-bottom: 20px;
            position: relative;
            border: 4px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 4px;
            min-height: 60px;
            width: 100%;
        }

        .char {
            font-family: 'Fredoka One', monospace;
            font-size: 48px;
            width: 40px;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.1s;
            position: relative;
        }

        .char.correct {
            color: #4ade80;
            text-shadow: 0 0 15px #4ade80;
            transform: scale(1.2) translateY(-5px);
        }

        .char.wrong {
            color: #f87171;
            animation: shake 0.4s;
        }

        .char.current {
            color: #fff;
            border-bottom: 4px solid #fbbf24;
        }

        /* Space special styling */
        .char.space {
            width: 30px;
        }

        .char.space.current {
            border-bottom: 4px solid #fbbf24;
        }

        .char.space.wrong {
            background: rgba(248, 113, 113, 0.3);
            border-radius: 4px;
        }

        /* Rocket Track */
        .track-container {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            height: 12px;
            border-radius: 10px;
            margin: 0 20px 20px;
            width: 100%;
        }

        .track-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s;
        }

        .rocket {
            position: absolute;
            top: -24px;
            left: 0%;
            font-size: 32px;
            transform: translateX(-50%) rotate(45deg);
            transition: left 0.3s;
            filter: drop-shadow(0 0 8px #f59e0b);
        }

        /* Hand Visuals */
        .hands-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
        }

        .hand {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hand label {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .hand svg {
            width: 120px;
            height: 140px;
            fill: none;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .finger {
            transition: all 0.2s;
            fill: rgba(255, 255, 255, 0.05);
        }

        .finger.active {
            fill: #fbbf24;
            stroke: #fbbf24;
        }

        .finger.thumb {}

        /* Just for selection */

        /* Controls */
        .controls-area {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        button {
            font-family: 'Fredoka One', cursive;
            font-size: 24px;
            padding: 14px 40px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(to bottom, #fbbf24, #d97706);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 0 #92400e;
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #92400e;
        }

        button.locked {
            filter: grayscale(100%);
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
            display: none;
            /* Hidden until unlocked */
            background: #cbd5e1;
            box-shadow: 0 6px 0 #64748b;
        }

        button.locked.unlocked {
            /* Just a class to remove locked styles if we were toggling classes, but display:none handles it */
        }

        /* Feedback Overlay */
        .feedback-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Fredoka One', cursive;
            font-size: 80px;
            color: #fff;
            text-shadow: 0 10px 0 rgba(0, 0, 0, 0.5);
            pointer-events: none;
            opacity: 0;
            z-index: 100;
        }

        .feedback-overlay.show {
            animation: popUpFade 1s forwards;
        }

        .info-msg {
            margin-top: 15px;
            font-size: 18px;
            color: #4ade80;
            font-weight: 800;
            min-height: 27px;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(6px);
            }

            60% {
                transform: translateX(-6px);
            }

            80% {
                transform: translateX(6px);
            }
        }

        @keyframes popUpFade {
            0% {
                opacity: 0;
                transform: translate(-50%, -30%) scale(0.5);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -60%) scale(1.2);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -80%) scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <div class="game-container">
        <h1>Space Typing Hero 🚀</h1>
        <p class="sub">Help the rocket fly! Use the correct fingers.</p>

        <div class="stats-bar">
            <div class="stat-pill"><span class="icon">⭐</span> <span id="lvlDisplay">Level 1</span></div>
            <div class="stat-pill"><span class="icon">🔄</span> <span id="roundDisplay">Round 1/20</span></div>
            <div class="stat-pill"><span class="icon">⏳</span> <span id="timerDisplay">20s</span></div>
            <div class="stat-pill highlight"><span class="icon">🎯</span> <span id="scoreDisplay">0</span></div>
            <div class="stat-pill"><span class="icon">❤️</span> <span id="accDisplay">0%</span></div>
        </div>

        <!-- Progress Track -->
        <div class="track-container">
            <div class="track-fill" id="trackFill"></div>
            <div class="rocket" id="rocket">🚀</div>
        </div>

        <!-- The typing words go here -->
        <div class="typing-box" id="typingBox">
            <div style="font-size:24px; color:rgba(255,255,255,0.5); margin-top:10px;">Press Start to Play!</div>
        </div>

        <!-- Hands Visual -->
        <div class="hands-container">
            <!-- Left Hand -->
            <div class="hand" id="leftHand">
                <label>Left Hand</label>
                <svg viewBox="0 0 100 120">
                    <path id="l-pinky" d="M10,60 Q10,30 20,30 Q30,30 30,60 L30,90" class="finger" />
                    <path id="l-ring" d="M32,50 Q32,15 42,15 Q52,15 52,50 L52,90" class="finger" />
                    <path id="l-middle" d="M54,45 Q54,5 64,5 Q74,5 74,45 L74,90" class="finger" />
                    <path id="l-index" d="M76,50 Q76,15 86,15 Q96,15 96,50 L96,90" class="finger" />
                    <path id="l-thumb" d="M80,95 Q100,105 90,120 M76,90 L96,90" class="finger thumb" />
                    <rect x="20" y="90" width="60" height="30" rx="10" fill="#334155" />
                </svg>
            </div>

            <!-- Right Hand -->
            <div class="hand" id="rightHand">
                <label>Right Hand</label>
                <svg viewBox="0 0 100 120">
                    <path id="r-index" d="M4,50 Q4,15 14,15 Q24,15 24,50 L24,90" class="finger" />
                    <path id="r-middle" d="M26,45 Q26,5 36,5 Q46,5 46,45 L46,90" class="finger" />
                    <path id="r-ring" d="M48,50 Q48,15 58,15 Q68,15 68,50 L68,90" class="finger" />
                    <path id="r-pinky" d="M70,60 Q70,30 80,30 Q90,30 90,60 L90,90" class="finger" />
                    <path id="r-thumb" d="M10,95 Q-10,105 10,120" class="finger thumb" />
                    <rect x="20" y="90" width="60" height="30" rx="10" fill="#334155" />
                </svg>
            </div>
        </div>

        <div class="controls-area">
            <button id="mainBtn">Start Mission</button>
            <button id="nextLvlBtn" class="locked">Next Level 🔓</button>
        </div>

        <div class="info-msg" id="infoMsg"></div>
    </div>

    <div class="feedback-overlay" id="feedback">Awesome!</div>

    <script>
        // Game Config
        const LEVELS = [
            { id: 1, chars: ['a', 'b', 'c', 'd', ' '], min: 6, max: 10 },
            { id: 2, chars: ['a', 'b', 'c', 'd', 'e', 'f', ' '], min: 8, max: 14 },
            { id: 3, chars: ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', ' '], min: 10, max: 16 }
        ];

        const MAX_ROUNDS = 20;
        const TARGET_ACCURACY = 95;
        const POINTS_PER_ROUND = 5;
        const TIME_LIMIT = 20;

        // Finger Mapping
        const FINGER_MAP = {
            'a': 'l-pinky',
            'b': 'l-index',
            'c': 'l-middle',
            'd': 'l-middle',
            'e': 'l-middle',
            'f': 'l-index',
            'g': 'l-index',
            'h': 'r-index',
            ' ': 'l-thumb'
        };

        // State
        let currentLevel = 0;
        let round = 1;
        let targetText = "";
        let currentIndex = 0;
        let isPlaying = false;
        let score = 0;
        let totalKeysInRound = 0;
        let correctKeysInRound = 0;
        let mistakesInRound = 0;
        let previousRoundsPoints = 0;
        let retriesForCurrentRound = 0;
        let timeLeft = TIME_LIMIT;
        let timerInterval = null;
        let activeRoundStartTime = 0;
        let totalTimeSpentMsAcrossLevel = 0;
        let totalCorrectCharsAcrossLevel = 0;

        // Audio
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'win') {
                osc.type = 'triangle';
                [0, 0.1, 0.2].forEach((t, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.value = 400 * (i + 1);
                    g.gain.setValueAtTime(0.05, audioCtx.currentTime + t);
                    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.3);
                    o.start(audioCtx.currentTime + t);
                    o.stop(audioCtx.currentTime + t + 0.3);
                });
            }
        }

        // Elements
        const typingBox = document.getElementById('typingBox');
        const rocket = document.getElementById('rocket');
        const trackFill = document.getElementById('trackFill');
        const mainBtn = document.getElementById('mainBtn');
        const nextLvlBtn = document.getElementById('nextLvlBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const accDisplay = document.getElementById('accDisplay');
        const lvlDisplay = document.getElementById('lvlDisplay');
        const roundDisplay = document.getElementById('roundDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const feedback = document.getElementById('feedback');
        const infoMsg = document.getElementById('infoMsg');

        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateText() {
            const lvl = LEVELS[currentLevel];
            const len = randInt(lvl.min, lvl.max);
            let str = "";
            for (let i = 0; i < len; i++) {
                // limit spaces
                let char = lvl.chars[randInt(0, lvl.chars.length - 1)];
                if (char === ' ' && (i === 0 || str[i - 1] === ' ')) {
                    char = 'a'; // fallback to prevent double space or leading space
                }
                str += char;
            }
            return str.trim();
        }

        function highlightFinger(char) {
            document.querySelectorAll('.finger').forEach(f => f.classList.remove('active'));
            const fingerId = FINGER_MAP[char.toLowerCase()];
            if (fingerId) {
                const el = document.getElementById(fingerId);
                if (el) el.classList.add('active');
            }
            if (char === ' ') {
                document.getElementById('l-thumb').classList.add('active');
                document.getElementById('r-thumb').classList.add('active');
            }
        }

        function renderText() {
            typingBox.innerHTML = '';
            targetText.split('').forEach((char, idx) => {
                const span = document.createElement('div');
                span.className = 'char ' + (char === ' ' ? 'space' : '');
                span.textContent = char;
                if (idx < currentIndex) span.classList.add('correct');
                if (idx === currentIndex) {
                    span.classList.add('current');
                    highlightFinger(char);
                }
                typingBox.appendChild(span);
            });
            if (currentIndex >= targetText.length) {
                document.querySelectorAll('.finger').forEach(f => f.classList.remove('active'));
            }
        }

        function updateProgress() {
            const pct = (currentIndex / targetText.length) * 100;
            rocket.style.left = pct + '%';
            trackFill.style.width = pct + '%';
        }

        function showFeedback(text) {
            feedback.textContent = text;
            feedback.classList.remove('show');
            void feedback.offsetWidth;
            feedback.classList.add('show');
            playSound('win');
        }

        function startTimer() {
            stopTimer(); // ensure clear
            timeLeft = TIME_LIMIT;
            timerDisplay.textContent = timeLeft + 's';
            timerDisplay.style.color = '#e2e8f0';

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft + 's';

                if (timeLeft <= 5) {
                    timerDisplay.style.color = '#f87171';
                }

                if (timeLeft <= 0) {
                    stopTimer();
                    failRound("Time's Up!");
                }
            }, 1000);
            activeRoundStartTime = Date.now();
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function nextRound() {
            targetText = generateText();
            currentIndex = 0;
            totalKeysInRound = 0;
            correctKeysInRound = 0;
            mistakesInRound = 0;
            retriesForCurrentRound = 0;
            renderText();
            updateProgress();

            updateMasteryDisplay();

            if (round <= MAX_ROUNDS) {
                mainBtn.style.display = 'none';
                // Clear message if not game over
                if (infoMsg.innerText.includes("Level Complete") || infoMsg.innerText.includes("Level Finished")) {
                    infoMsg.innerText = "";
                } else if (round > 1) {
                    infoMsg.innerText = `Keep going! 1 mistake allowed.`;
                }
                startTimer();
            }
        }

        function retryRound() {
            targetText = generateText();
            currentIndex = 0;
            totalKeysInRound = 0;
            correctKeysInRound = 0;
            mistakesInRound = 0;

            renderText();
            updateProgress();
            updateMasteryDisplay();

            mainBtn.style.display = 'none';
            infoMsg.innerText = `Retry attempt #${retriesForCurrentRound}. Good luck!`;
            startTimer();
        }

        function startGame() {
            isPlaying = true;
            score = 0;
            round = 1;
            previousRoundsPoints = 0;
            totalTimeSpentMsAcrossLevel = 0;
            totalCorrectCharsAcrossLevel = 0;

            scoreDisplay.textContent = score;
            accDisplay.textContent = '0%';
            lvlDisplay.textContent = 'Level ' + (currentLevel + 1);
            roundDisplay.textContent = 'Round ' + round + '/' + MAX_ROUNDS;
            nextLvlBtn.style.display = 'none';
            infoMsg.innerHTML = "Type the letters. Max 1 error per round!";

            document.addEventListener('keydown', handleKey);
            nextRound();
        }

        function nextLevel() {
            if (currentLevel < LEVELS.length - 1) {
                currentLevel++;
                startGame();
            }
        }

        function handleKey(e) {
            if (!isPlaying) return;
            if (e.ctrlKey || e.altKey || e.metaKey) return;
            if (e.key.length !== 1) return;

            // Ignore input if timer is 0
            if (timeLeft <= 0) return;

            if (mainBtn.style.display !== 'none' && document.activeElement !== mainBtn) {
                if (mainBtn.textContent.includes("Next Round")) {
                    if (e.key === "Enter") {
                        round++;
                        updateRoundUI();
                        return;
                    }
                    return;
                }
            }

            const targetChar = targetText[currentIndex];
            totalKeysInRound++;

            if (e.key.toLowerCase() === targetChar.toLowerCase()) {
                playSound('hit');
                correctKeysInRound++;
                totalCorrectCharsAcrossLevel++;
                currentIndex++;
                score += 10;

                renderText();
                updateProgress();

                if (currentIndex >= targetText.length) {
                    finishRound();
                    return;
                }
            } else {
                playSound('error');
                mistakesInRound++;

                const spans = typingBox.children;
                if (spans[currentIndex]) {
                    spans[currentIndex].classList.add('wrong');
                    setTimeout(() => spans[currentIndex].classList.remove('wrong'), 400);
                }

                if (mistakesInRound >= 2) {
                    failRound("2 Errors!");
                    return;
                }
            }

            updateMasteryDisplay();
        }

        function failRound(reason) {
            stopTimer();
            // Accumulate time spent even on failure
            if (activeRoundStartTime > 0) {
                totalTimeSpentMsAcrossLevel += (Date.now() - activeRoundStartTime);
            }

            showFeedback("Oops!");
            infoMsg.innerText = `${reason} Round Failed. Try Again.`;

            retriesForCurrentRound++;

            document.body.style.backgroundColor = "#7f1d1d";
            setTimeout(() => { document.body.style.backgroundColor = ""; }, 300);

            // Auto-restart for all failure types
            if (reason === "Time's Up!") {
                infoMsg.innerText = "Time's Up! Restarting in 2 seconds...";
            } else {
                infoMsg.innerText = `${reason} Round Failed. Restarting in 2 seconds...`;
            }

            setTimeout(() => {
                if (isPlaying) retryRound();
            }, 2000);

            totalKeysInRound = 0;
            correctKeysInRound = 0;
            updateMasteryDisplay();
        }

        function updateMasteryDisplay() {
            scoreDisplay.textContent = score;

            let potentialPoints = Math.max(1, POINTS_PER_ROUND - retriesForCurrentRound);
            let currentRoundPoints = (correctKeysInRound / targetText.length) * potentialPoints;

            let totalPct = previousRoundsPoints + currentRoundPoints;
            accDisplay.textContent = Math.round(totalPct) + '%';
        }

        function finishRound() {
            stopTimer();
            // Accumulate time spent
            if (activeRoundStartTime > 0) {
                totalTimeSpentMsAcrossLevel += (Date.now() - activeRoundStartTime);
            }

            showFeedback(["Awesome!", "Good!", "Nice!"][randInt(0, 2)]);

            let pointsEarned = Math.max(1, POINTS_PER_ROUND - retriesForCurrentRound);

            previousRoundsPoints += pointsEarned;
            accDisplay.textContent = Math.round(previousRoundsPoints) + '%';

            correctKeysInRound = 0;
            totalKeysInRound = 0;
            targetText = "";

            if (round < MAX_ROUNDS) {
                mainBtn.textContent = "Next Round";
                mainBtn.style.display = 'inline-block';
            } else {
                handleLevelComplete(previousRoundsPoints);
            }
        }

        function updateRoundUI() {
            roundDisplay.textContent = 'Round ' + round + '/' + MAX_ROUNDS;
            mainBtn.style.display = 'none';
            nextRound();
        }

        function handleLevelComplete(mastery) {
            isPlaying = false;
            stopTimer();

            let finalPct = Math.round(mastery);

            if (finalPct >= 90) { // Slightly lower threshold to be forgiving
                // Speed calculation: (Characters / 5) / (Time in Minutes)
                let timeInMinutes = totalTimeSpentMsAcrossLevel / 60000;
                let wpm = timeInMinutes > 0 ? Math.round((totalCorrectCharsAcrossLevel / 5) / timeInMinutes) : 0;

                infoMsg.innerHTML = `🎉 Level Complete! Mastery: ${finalPct}% <br> Speed: ${wpm} WPM! You are a Pro!`;

                if (currentLevel < LEVELS.length - 1) {
                    nextLvlBtn.classList.remove('locked');
                    nextLvlBtn.style.display = 'inline-block';
                    mainBtn.style.display = 'none';
                } else {
                    infoMsg.innerHTML += "<br>You finished ALL levels!";
                    mainBtn.textContent = "Play Again";
                    mainBtn.style.display = 'inline-block';
                }
            } else {
                infoMsg.innerHTML = `Level Finished. Mastery: ${finalPct}% - Need 90%+<br>Restarting level in 3 seconds...`;
                setTimeout(() => {
                    startGame(); // Auto-restart the level
                }, 3000);
            }
        }

        mainBtn.addEventListener('click', () => {
            if (mainBtn.textContent.includes("Next Round")) {
                round++;
                updateRoundUI();
            } else {
                startGame();
            }
        });

        nextLvlBtn.addEventListener('click', nextLevel);

    </script>
</body>

</html>
