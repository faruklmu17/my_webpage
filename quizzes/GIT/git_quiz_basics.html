<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>🔧 Git &amp; GitHub Beginner Quiz | Version Control Mastery</title>
<meta content="Master Git and GitHub fundamentals with this comprehensive 16-question quiz covering repositories, commits, branches, and collaboration workflows." name="description">
<meta content="git quiz, github quiz, version control, git commands, git basics, programming quiz" name="keywords">
<meta content="Faruk Hasan" name="author"/>
<!-- Open Graph Meta Tags -->
<meta content="Git &amp; GitHub Beginner Quiz | Version Control Mastery" property="og:title"/>
<meta content="Test your Git and GitHub knowledge with 16 comprehensive questions covering repositories, commits, branches, and collaboration." property="og:description"/>
<meta content="website" property="og:type"/>
<meta content="https://faruk-hasan.com/quizzes/GIT/git_quiz_basics.html" property="og:url"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="../../shared/quiz-style.css" rel="stylesheet"/>
</meta></meta><link href="https://faruk-hasan.com/quizzes/GIT/git_quiz_basics.html" rel="canonical"/></head>
<body>
<h1>🔧 Git &amp; GitHub Mastery Quiz</h1>
<div class="quiz-container">
<a class="back-link" href="../../resources/resources.html"><i class="fas fa-arrow-left"></i> Back to Resources</a>
<div class="progress-wrapper">
<div class="progress-container">
<div id="progress-fill"></div>
</div>
<div id="progress-count">0/16 answered</div>
</div>
<form id="quiz-form">
<div id="quiz-area"></div>
<button id="submitBtn" onclick="submitQuiz()" type="button">Submit Results</button>
</form>
<div id="results">
<div class="score-container">
<div class="score-circle">0</div>
<div class="score-label">Your Score</div>
</div>
<div class="feedback"></div>
<div class="action-buttons">
<a class="secondary-btn" href="" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
<a class="secondary-btn" href="../../resources/resources.html"><i class="fas fa-th-list"></i> More Quizzes</a>
</div>
<div class="answer-key" id="answer-key"></div>
</div>
</div>
<script>
    const questions = [
      {
        q: "1. What is Git?",
        options: ["a) A programming language", "b) A cloud storage service", "c) A version control system", "d) A code editor"],
        correct: "c",
        explanation: "Git is a distributed version control system used for tracking changes in source code during software development."
      },
      {
        q: "2. Which command initializes a new Git repository?",
        options: ["a) git init", "b) git start", "c) git create", "d) git new"],
        correct: "a",
        explanation: "git init creates a new Git repository."
      },
      {
        q: "3. Which command shows the current status of your Git repository?",
        options: ["a) git log", "b) git push", "c) git status", "d) git info"],
        correct: "c",
        explanation: "git status displays the state of the working directory and the staging area."
      },
      {
        q: "4. What does <code>git add</code> do?",
        options: ["a) Sends code to GitHub", "b) Tracks files and stages them for commit", "c) Deletes a file", "d) Creates a new repo"],
        correct: "b",
        explanation: "git add adds changes in the working directory to the staging area."
      },
      {
        q: "5. What is the purpose of <code>git commit -m \"message\"</code>?",
        options: ["a) To upload code to GitHub", "b) To stage files", "c) To save a snapshot of changes with a message", "d) To merge branches"],
        correct: "c",
        explanation: "Commits record changes to the repository with a descriptive message."
      },
      {
        q: "6. <code>git clone</code> creates a copy of a remote repository on your local machine.",
        options: ["True", "False"],
        correct: "True",
        explanation: "Cloning downloads an existing Git repository to your local computer."
      },
      {
        q: "7. You can make commits without staging files using <code>git add</code>.",
        options: ["True", "False"],
        correct: "False",
        explanation: "Changes must be staged (added) before they can be committed, unless using specific flags like -a."
      },
      {
        q: "8. GitHub is a web-based interface for managing Git repositories.",
        options: ["True", "False"],
        correct: "True",
        explanation: "GitHub is a hosting service for Git repositories that provides a graphical interface and collaboration tools."
      },
      {
        q: "9. A Git branch lets you work on different versions of your project at the same time.",
        options: ["True", "False"],
        correct: "True",
        explanation: "Branches allow for isolated development of features or fixes without affecting the main line of development."
      },
      {
        q: "10. <code>git pull</code> uploads changes from your local computer to GitHub.",
        options: ["True", "False"],
        correct: "False",
        explanation: "git pull fetches changes from a remote repository and integrates them into your current branch."
      },
      {
        q: "11. What command do you use to upload your local commits to GitHub?",
        options: ["git push", "git pull", "git upload", "git send"],
        correct: "git push",
        explanation: "git push is used to transmit local repository content to a remote repository."
      },
      {
        q: "12. What is the default name of the main branch in Git?",
        options: ["main", "master", "primary", "trunk"],
        correct: "main",
        explanation: "While master was the old default, 'main' is now the standard default branch name."
      },
      {
        q: "13. What is a 'commit message'? Why is it important?",
        options: [
          "A description of changes; tracks project history.",
          "A secret password for the repo.",
          "The name of the author.",
          "A command to delete the repo."
        ],
        correct: "A description of changes; tracks project history.",
        explanation: "Clear commit messages help team members understand the history and purpose of changes."
      },
      {
        q: "14. Name the file that Git uses to ignore certain files from tracking.",
        options: [".gitignore", ".gitconfig", ".gitinfo", ".gitexclude"],
        correct: ".gitignore",
        explanation: ".gitignore specifies intentionally untracked files that Git should ignore."
      },
      {
        q: "15. What is a pull request used for on GitHub?",
        options: ["Propose and merge changes.", "Download a repo.", "Delete a branch.", "Change the repo name."],
        correct: "Propose and merge changes.",
        explanation: "Pull requests let you tell others about changes you've pushed to a branch in a repository on GitHub."
      },
      {
        q: "16. Which command creates and switches to a new branch?",
        options: ["git checkout -b", "git branch new", "git switch", "git add branch"],
        correct: "git checkout -b",
        explanation: "The -b flag with checkout creates a new branch and immediately switches to it."
      }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';

      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;

        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
      });

      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';

      const percentage = (score / questions.length) * 100;
      let feedbackText = '';
      if (percentage >= 90) feedbackText = 'Excellent! You are a Git Master.';
      else if (percentage >= 70) feedbackText = 'Good job! You have a solid grasp of version control.';
      else feedbackText = 'Keep studying! Git is essential for modern development.';

      document.querySelector('.feedback').textContent = feedbackText;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
