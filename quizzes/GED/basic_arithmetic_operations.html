<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GED Math: Order of Operations (PEMDAS) Practice Quiz | Free GED Prep</title>
<meta content="Free GED Math practice quiz on order of operations (PEMDAS). Test your skills with 20 questions covering basic arithmetic operations for the GED test. Get instant feedback and explanations." name="description"/>
<meta content="GED math practice, PEMDAS quiz, order of operations, GED test prep, free GED practice, GED math questions, basic arithmetic, GED study guide" name="keywords"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
<link href="../../shared/quiz-style.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css" rel="stylesheet"/>
<script defer="" src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
<script defer="" onload="renderMathInElement(document.body);" src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/contrib/auto-render.min.js"></script>
<link href="https://faruk-hasan.com/quizzes/GED/basic_arithmetic_operations.html" rel="canonical"/></head>
<body>
<h1>🧮 GED Math: Order of Operations (PEMDAS)</h1>
<div class="quiz-container">
<a class="back-link" href="../../resources/resources.html"><i class="fas fa-arrow-left"></i> Back to
            Resources</a>
<div class="intro">
<p>Prepare for the GED Math test by focusing on the <strong>PEMDAS</strong> rules:
                <strong>P</strong>arentheses, <strong>E</strong>xponents, <strong>M</strong>ultiplication &amp;
                <strong>D</strong>ivision, <strong>A</strong>ddition &amp; <strong>S</strong>ubtraction.
            </p>
</div>
<div class="progress-wrapper">
<div class="progress-container">
<div id="progress-fill"></div>
</div>
<div id="progress-count">0/20 answered</div>
</div>
<form id="quiz-form">
<div id="quiz-area"></div>
<button id="submitBtn" onclick="submitQuiz()" type="button">Submit Results</button>
</form>
<div id="results">
<div class="score-container">
<div class="score-circle">0</div>
<div class="score-label">Your Score</div>
</div>
<div class="feedback"></div>
<div class="action-buttons">
<a class="secondary-btn" href="" onclick="location.reload(); return false;"><i class="fas fa-redo"></i>
                    Retake Quiz</a>
<a class="secondary-btn" href="../../resources/resources.html"><i class="fas fa-th-list"></i> More
                    Quizzes</a>
</div>
<div class="answer-key" id="answer-key"></div>
</div>
</div>
<script>
        const questions = [
            { q: "1. What is the result of 15 + 7 × 2?", options: ["A) 44", "B) 29", "C) 25", "D) 34"], correct: "B", explanation: "Multiply first: 7 × 2 = 14. Then add: 15 + 14 = 29." },
            { q: "2. Simplify: 18 - 4 × 3 + 6", options: ["A) 6", "B) 12", "C) 15", "D) 18"], correct: "B", explanation: "Multiply first: 4 × 3 = 12. Then 18 - 12 = 6. Finally 6 + 6 = 12." },
            { q: "3. What is the result of (6 + 4) × 3?", options: ["A) 24", "B) 30", "C) 27", "D) 28"], correct: "B", explanation: "Parentheses first: 6 + 4 = 10. Then 10 × 3 = 30." },
            { q: "4. Simplify: 24 ÷ (2 + 4)", options: ["A) 4", "B) 6", "C) 3", "D) 8"], correct: "A", explanation: "Parentheses first: 2 + 4 = 6. Then 24 ÷ 6 = 4." },
            { q: "5. What is 4 × (5 + 3) - 12?", options: ["A) 20", "B) 16", "C) 22", "D) 24"], correct: "A", explanation: "Parentheses: 5 + 3 = 8. Multiply: 4 × 8 = 32. Subtract: 32 - 12 = 20." },
            { q: "6. Simplify: 6 + 2 × (5 + 3)", options: ["A) 30", "B) 22", "C) 16", "D) 20"], correct: "B", explanation: "Parentheses: 5 + 3 = 8. Multiply: 2 × 8 = 16. Add: 6 + 16 = 22." },
            { q: "7. What is the result of (12 - 3) × 4 ÷ 3?", options: ["A) 12", "B) 15", "C) 9", "D) 16"], correct: "A", explanation: "Parentheses: 12 - 3 = 9. Multiply: 9 × 4 = 36. Divide: 36 ÷ 3 = 12." },
            { q: "8. Simplify: 10 + 3 × (8 - 5)", options: ["A) 19", "B) 13", "C) 20", "D) 17"], correct: "A", explanation: "Parentheses: 8 - 5 = 3. Multiply: 3 × 3 = 9. Add: 10 + 9 = 19." },
            { q: "9. What is the result of 8 + 5 × (6 - 4)?", options: ["A) 18", "B) 26", "C) 20", "D) 22"], correct: "A", explanation: "Parentheses: 6 - 4 = 2. Multiply: 5 × 2 = 10. Add: 8 + 10 = 18." },
            { q: "10. Simplify: (15 + 5) ÷ (12 - 8)", options: ["A) 5", "B) 4", "C) 3", "D) 6"], correct: "A", explanation: "Parentheses: 20 and 4. Divide: 20 ÷ 4 = 5." },
            { q: "11. What is 2 \times 3^2 + 4?", options: ["A) 22", "B) 40", "C) 13", "D) 20"], correct: "A", explanation: "Exponents first: 3^2 = 9. Multiply: 2 × 9 = 18. Add: 18 + 4 = 22." },
            { q: "12. Simplify: (4^2 - 6) \times 2", options: ["A) 20", "B) 10", "C) 16", "D) 12"], correct: "A", explanation: "Inside parentheses: 4^2 = 16, then 16 - 6 = 10. Multiply: 10 × 2 = 20." },
            { q: "13. What is 5 \times 2 + 10 \div 2?", options: ["A) 15", "B) 10", "C) 20", "D) 12"], correct: "A", explanation: "Multiply and Divide left to right: 10 + 5 = 15." },
            { q: "14. Simplify: 20 - (4 + 6) \div 2", options: ["A) 15", "B) 5", "C) 10", "D) 12"], correct: "A", explanation: "Parentheses: 10. Divide: 10 ÷ 2 = 5. Subtract: 20 - 5 = 15." },
            { q: "15. What is (3 + 5)^2 \div 8?", options: ["A) 8", "B) 16", "C) 4", "D) 12"], correct: "A", explanation: "Parentheses: 8. Exponents: 8^2 = 64. Divide: 64 ÷ 8 = 8." },
            { q: "16. Simplify: 12 + 6 \div 3 \times 4", options: ["A) 20", "B) 24", "C) 16", "D) 18"], correct: "A", explanation: "Divide first: 6 ÷ 3 = 2. Multiply: 2 × 4 = 8. Add: 12 + 8 = 20." },
            { q: "17. What is 50 - 2 \times (10 + 5)?", options: ["A) 20", "B) 35", "C) 15", "D) 30"], correct: "A", explanation: "Parentheses: 15. Multiply: 2 × 15 = 30. Subtract: 50 - 30 = 20." },
            { q: "18. Simplify: 100 \div (5 \times 2)^2", options: ["A) 1", "B) 10", "C) 4", "D) 2"], correct: "A", explanation: "Parentheses: 10. Exponents: 10^2 = 100. Divide: 100 ÷ 100 = 1." },
            { q: "19. What is (8 + 2 \times 3) - 5?", options: ["A) 9", "B) 11", "C) 15", "D) 7"], correct: "A", explanation: "Inside parentheses: 2 × 3 = 6, 8 + 6 = 14. Subtract: 14 - 5 = 9." },
            { q: "20. Simplify: 14 + 12 \div 4 - 2 \times 3", options: ["A) 11", "B) 14", "C) 10", "D) 12"], correct: "A", explanation: "Divide: 12 ÷ 4 = 3. Multiply: 2 × 3 = 6. Expression: 14 + 3 - 6 = 11." }
        ];

        const quizArea = document.getElementById("quiz-area");
        questions.forEach((q, i) => {
            const div = document.createElement("div");
            div.className = "question";
            div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
                q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
                `</div>`;
            quizArea.appendChild(div);
        });

        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
                document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
                document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
            });
        });

        function submitQuiz() {
            let score = 0;
            let html = '<h2>Detailed Results</h2>';

            questions.forEach((q, i) => {
                const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
                const isCorrect = selected && selected.value === q.correct;
                if (isCorrect) score++;

                html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
            });

            document.querySelector('.score-circle').textContent = score + '/' + questions.length;
            document.getElementById('answer-key').innerHTML = html;
            document.getElementById('quiz-form').style.display = 'none';
            document.getElementById('results').style.display = 'block';

            // Process KaTeX in results
            if (window.renderMathInElement) renderMathInElement(document.getElementById('answer-key'));

            const percentage = (score / questions.length) * 100;
            let feedbackText = '';
            if (percentage >= 90) feedbackText = 'Excellent! You Have Mastered the Order of Operations.';
            else if (percentage >= 70) feedbackText = 'Good job! You have a solid grasp of these concepts.';
            else feedbackText = 'Keep studying! PEMDAS is the foundation of Algebra.';

            document.querySelector('.feedback').textContent = feedbackText;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
