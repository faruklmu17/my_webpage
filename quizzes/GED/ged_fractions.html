<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fraction Addition Quiz | GED Math Prep Mastery</title>
<meta content="Master fractions with this interactive GED Math quiz. 20 questions on addition, common denominators, and simplifying fractions." name="description"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="../../shared/quiz-style.css" rel="stylesheet"/>
<script async="" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<link href="https://faruk-hasan.com/quizzes/GED/ged_fractions.html" rel="canonical"/></head>
<body>
<h1>🍕 Fraction Addition Quiz</h1>
<div class="quiz-container">
<a class="back-link" href="../../resources/resources.html"><i class="fas fa-arrow-left"></i> Back to Resources</a>
<div class="intro">
<p>Test your skills adding fractions with both like and unlike denominators. Remember to simplify your final
        answers!</p>
</div>
<div class="progress-wrapper">
<div class="progress-container">
<div id="progress-fill"></div>
</div>
<div id="progress-count">0/20 answered</div>
</div>
<form id="quiz-form">
<div id="quiz-area"></div>
<button id="submitBtn" onclick="submitQuiz()" type="button">Submit Results</button>
</form>
<div id="results">
<div class="score-container">
<div class="score-circle">0</div>
<div class="score-label">Your Score</div>
</div>
<div class="feedback"></div>
<div class="action-buttons">
<a class="secondary-btn" href="" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
<a class="secondary-btn" href="../../resources/resources.html"><i class="fas fa-th-list"></i> More Quizzes</a>
</div>
<div class="answer-key" id="answer-key"></div>
</div>
</div>
<script>
    const questions = [
      { q: "1. Simplify: \\(\\frac{1}{4} + \\frac{2}{4}\\)", options: ["A) \\(\\frac{3}{4}\\)", "B) \\(\\frac{3}{8}\\)", "C) \\(\\frac{1}{2}\\)", "D) \\(\\frac{4}{4}\\)"], correct: "A", explanation: "With like denominators, just add the numerators: 1+2=3. Keeps the denominator 4." },
      { q: "2. Simplify: \\(\\frac{1}{2} + \\frac{1}{3}\\)", options: ["A) \\(\\frac{2}{5}\\)", "B) \\(\\frac{5}{6}\\)", "C) \\(\\frac{1}{6}\\)", "D) \\(\\frac{3}{5}\\)"], correct: "B", explanation: "Common denominator is 6. \\(\\frac{3}{6} + \\frac{2}{6} = \\frac{5}{6}\\)." },
      { q: "3. Simplify: \\(\\frac{2}{5} + \\frac{1}{10}\\)", options: ["A) \\(\\frac{3}{15}\\)", "B) \\(\\frac{1}{2}\\)", "C) \\(\\frac{3}{10}\\)", "D) \\(\\frac{5}{10}\\)"], correct: "B", explanation: "\\(\\frac{4}{10} + \\frac{1}{10} = \\frac{5}{10}\\), which simplifies to \\(\\frac{1}{2}\\)." },
      { q: "4. Simplify: \\(\\frac{3}{8} + \\frac{1}{8}\\)", options: ["A) \\(\\frac{1}{2}\\)", "B) \\(\\frac{4}{16}\\)", "C) \\(\\frac{1}{4}\\)", "D) \\(\\frac{3}{64}\\)"], correct: "A", explanation: "\\(\\frac{3+1}{8} = \\frac{4}{8} = \\frac{1}{2}\\)." },
      { q: "5. Simplify: \\(\\frac{2}{3} + \\frac{1}{4}\\)", options: ["A) \\(\\frac{3}{7}\\)", "B) \\(\\frac{11}{12}\\)", "C) \\(\\frac{7}{12}\\)", "D) \\(\\frac{2}{12}\\)"], correct: "B", explanation: "LCD is 12. \\(\\frac{8}{12} + \\frac{3}{12} = \\frac{11}{12}\\)." },
      { q: "6. Simplify: \\(\\frac{1}{5} + \\frac{2}{5}\\)", options: ["A) \\(\\frac{3}{10}\\)", "B) \\(\\frac{3}{5}\\)", "C) \\(\\frac{4}{5}\\)", "D) \\(\\frac{2}{25}\\)"], correct: "B", explanation: "Like denominators: 1+2 = 3 over 5." },
      { q: "7. Simplify: \\(\\frac{1}{6} + \\frac{1}{6}\\)", options: ["A) \\(\\frac{1}{3}\\)", "B) \\(\\frac{2}{12}\\)", "C) \\(\\frac{1}{12}\\)", "D) \\(\\frac{2}{6}\\)"], correct: "A", explanation: "\\(\\frac{2}{6}\\) simplifies to \\(\\frac{1}{3}\\)." },
      { q: "8. Simplify: \\(\\frac{3}{4} + \\frac{1}{8}\\)", options: ["A) \\(\\frac{7}{8}\\)", "B) \\(\\frac{4}{12}\\)", "C) \\(\\frac{1}{2}\\)", "D) \\(\\frac{5}{8}\\)"], correct: "A", explanation: "\\(\\frac{6}{8} + \\frac{1}{8} = \\frac{7}{8}\\)." },
      { q: "9. Simplify: \\(\\frac{2}{7} + \\frac{3}{7}\\)", options: ["A) \\(\\frac{5}{14}\\)", "B) \\(\\frac{5}{7}\\)", "C) \\(\\frac{6}{49}\\)", "D) \\(\\frac{1}{7}\\)"], correct: "B", explanation: "Numerator 2+3=5, Denominator stays 7." },
      { q: "10. Simplify: \\(\\frac{1}{3} + \\frac{1}{6}\\)", options: ["A) \\(\\frac{2}{9}\\)", "B) \\(\\frac{1}{2}\\)", "C) \\(\\frac{3}{6}\\)", "D) B and C"], correct: "D", explanation: "\\(\\frac{2}{6} + \\frac{1}{6} = \\frac{3}{6}\\), which is also \\(\\frac{1}{2}\\)." },
      { q: "11. Simplify: \\(\\frac{5}{12} + \\frac{1}{4}\\)", options: ["A) \\(\\frac{2}{3}\\)", "B) \\(\\frac{8}{12}\\)", "C) \\(\\frac{3}{4}\\)", "D) \\(\\frac{1}{2}\\)"], correct: "A", explanation: "\\(\\frac{5}{12} + \\frac{3}{12} = \\frac{8}{12} = \\frac{2}{3}\\)." },
      { q: "12. Simplify: \\(\\frac{2}{9} + \\frac{4}{9}\\)", options: ["A) \\(\\frac{6}{9}\\)", "B) \\(\\frac{2}{3}\\)", "C) Both A and B", "D) \\(\\frac{6}{18}\\)"], correct: "C", explanation: "6/9 simplify to 2/3." },
      { q: "13. Simplify: \\(\\frac{1}{10} + \\frac{7}{10}\\)", options: ["A) \\(\\frac{8}{10}\\)", "B) \\(\\frac{4}{5}\\)", "C) Both A and B", "D) \\(\\frac{8}{20}\\)"], correct: "C", explanation: "8/10 simplify to 4/5." },
      { q: "14. Simplify: \\(\\frac{3}{5} + \\frac{1}{4}\\)", options: ["A) \\(\\frac{17}{20}\\)", "B) \\(\\frac{4}{9}\\)", "C) \\(\\frac{7}{20}\\)", "D) \\(\\frac{4}{20}\\)"], correct: "A", explanation: "\\(\\frac{12}{20} + \\frac{5}{20} = \\frac{17}{20}\\)." },
      { q: "15. Simplify: \\(\\frac{1}{2} + \\frac{1}{2}\\)", options: ["A) \\(\\frac{2}{4}\\)", "B) \\(1\\)", "C) \\(\\frac{1}{4}\\)", "D) \\(\\frac{2}{2}\\)"], correct: "B", explanation: "Two halves make a whole." },
      { q: "16. Simplify: \\(\\frac{5}{8} + \\frac{1}{2}\\)", options: ["A) \\(\\frac{6}{8}\\)", "B) \\(1\\frac{1}{8}\\)", "C) \\(\\frac{9}{8}\\)", "D) B and C"], correct: "D", explanation: "\\(\\frac{5}{8} + \\frac{4}{8} = \\frac{9}{8} = 1\\frac{1}{8}\\)." },
      { q: "17. Simplify: \\(\\frac{3}{10} + \\frac{2}{5}\\)", options: ["A) \\(\\frac{5}{15}\\)", "B) \\(\\frac{7}{10}\\)", "C) \\(\\frac{1}{2}\\)", "D) \\(\\frac{5}{10}\\)"], correct: "B", explanation: "\\(\\frac{3}{10} + \\frac{4}{10} = \\frac{7}{10}\\)." },
      { q: "18. Simplify: \\(\\frac{1}{4} + \\frac{1}{4} + \\frac{1}{4}\\)", options: ["A) \\(\\frac{3}{4}\\)", "B) \\(\\frac{3}{12}\\)", "C) \\(\\frac{1}{4}\\)", "D) \\(\\frac{4}{4}\\)"], correct: "A" },
      { q: "19. Simplify: \\(\\frac{2}{3} + \\frac{2}{3}\\)", options: ["A) \\(\\frac{4}{3}\\)", "B) \\(1\\frac{1}{3}\\)", "C) Both A and B", "D) \\(\\frac{4}{6}\\)"], correct: "C" },
      { q: "20. Simplify: \\(\\frac{1}{8} + \\frac{3}{8} + \\frac{4}{8}\\)", options: ["A) \\(1\\)", "B) \\(\\frac{8}{8}\\)", "C) Both A and B", "D) \\(\\frac{8}{24}\\)"], correct: "C" }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
      });
      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
