<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>🔌 Arduino Basics Mastery Quiz | Breadboards &amp; Ohm's Law</title>
<meta content="Test your Arduino fundamentals with this 25-question quiz covering breadboards, Wokwi simulation, LEDs, and Ohm’s Law." name="description"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="../../shared/quiz-style.css" rel="stylesheet"/>
<link href="https://faruk-hasan.com/quizzes/Arduino/arduino_board_basic_electronics_quiz.html" rel="canonical"/></head>
<body>
<h1>🔌 Arduino Basics Mastery Quiz</h1>
<div class="quiz-container">
<a class="back-link" href="../../resources/resources.html"><i class="fas fa-arrow-left"></i> Back to Resources</a>
<div class="intro">
<p>Check your understanding of breadboards, Wokwi simulation, LEDs (series vs parallel), Ohm’s Law, and power
        limits.</p>
</div>
<div class="progress-wrapper">
<div class="progress-container">
<div id="progress-fill"></div>
</div>
<div id="progress-count">0/20 answered</div>
</div>
<form id="quiz-form">
<div id="quiz-area"></div>
<button id="submitBtn" onclick="submitQuiz()" type="button">Submit Results</button>
</form>
<div id="results">
<div class="score-container">
<div class="score-circle">0</div>
<div class="score-label">Your Score</div>
</div>
<div class="feedback"></div>
<div class="action-buttons">
<a class="secondary-btn" href="" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
<a class="secondary-btn" href="../../resources/resources.html"><i class="fas fa-th-list"></i> More Quizzes</a>
</div>
<div class="answer-key" id="answer-key"></div>
</div>
</div>
<script>
    const questions = [
      { q: "1. What is the main purpose of a breadboard?", options: ["a) To permanently solder parts", "b) To connect parts without soldering", "c) To power an Arduino directly", "d) To cool electronic components"], correct: "B", explanation: "Breadboards are for prototyping without solder." },
      { q: "2. On a breadboard, the side rails are typically used for:", options: ["a) Connecting resistors", "b) Holding the Arduino board", "c) Power and ground connections", "d) Mounting LEDs"], correct: "C", explanation: "Side rails distribute VCC and GND." },
      { q: "3. In Wokwi, clicking the green Start button does what?", options: ["a) Compiles code only", "b) Runs the simulation", "c) Saves the project", "d) Opens the Serial Monitor"], correct: "B", explanation: "Start runs the full simulation." },
      { q: "4. What is the role of a resistor in an LED circuit?", options: ["a) Increases current", "b) Limits current to protect LED", "c) Stores energy", "d) Changes DC to AC"], correct: "B", explanation: "Prevents overcurrent." },
      { q: "5. When two LEDs are connected in series, how is brightness affected?", options: ["a) Brighter", "b) Dimmer", "c) Same", "d) LEDs turn off"], correct: "B", explanation: "Voltage is split, resulting in lower power per LED." },
      { q: "6. In a parallel LED circuit, each LED should:", options: ["a) Share one resistor", "b) Have its own resistor", "c) Get half current", "d) Be connected to GND directly"], correct: "B", explanation: "Individual resistors ensure equal current distribution." },
      { q: "7. The max safe current from a USB 2.0 port is:", options: ["a) 100 mA", "b) 250 mA", "c) 500 mA", "d) 1A"], correct: "C", explanation: "USB 2.0 limit is 500mA." },
      { q: "8. According to Ohm’s Law, current I equals:", options: ["a) V * R", "b) R / V", "c) V / R", "d) V + R"], correct: "C", explanation: "I = V / R." },
      { q: "9. Total resistance in series (200 Ω + 300 Ω) is:", options: ["a) 100 Ω", "b) 500 Ω", "c) 150 Ω", "d) 250 Ω"], correct: "B", explanation: "Resistors in series add up." },
      { q: "10. Two resistors (200 Ω and 300 Ω) in parallel have Rt of approximately:", options: ["a) 500 Ω", "b) 120 Ω", "c) 60 Ω", "d) 300 Ω"], correct: "B", explanation: "1/Rt = 1/200 + 1/300 -> Rt = 120 Ω." },
      { q: "11. T/F: You must use glue to keep components on a breadboard.", options: ["A) True", "B) False"], correct: "B", explanation: "Holes are designed to hold leads by tension." },
      { q: "12. T/F: The blue/black line on a breadboard rail represents ground.", options: ["A) True", "B) False"], correct: "A", explanation: "Standard convention for GND." },
      { q: "13. T/F: Removing a component from a breadboard damages it.", options: ["A) True", "B) False"], correct: "B", explanation: "Breadboards are reusable." },
      { q: "14. T/F: The LED anode connects to the positive side of the circuit.", options: ["A) True", "B) False"], correct: "A", explanation: "Anode is positive, Cathode is negative." },
      { q: "15. T/F: A 220 Ω resistor offers less resistance than a 330 Ω resistor.", options: ["A) True", "B) False"], correct: "A", explanation: "220 is a lower value than 330." },
      { q: "16. T/F: Two LEDs in series share the same current.", options: ["A) True", "B) False"], correct: "A", explanation: "Series circuit property." },
      { q: "17. T/F: Arduino Uno can run in Wokwi without installing software.", options: ["A) True", "B) False"], correct: "A", explanation: "Wokwi is a web-based simulator." },
      { q: "18. T/F: Parallel circuits use less total current than series.", options: ["A) True", "B) False"], correct: "B", explanation: "Parallel paths add up total current." },
      { q: "19. T/F: Series resistors prevent LED burnout.", options: ["A) True", "B) False"], correct: "A", explanation: "Correct." },
      { q: "20. T/F: Ohm's Law can find any value if two others are known.", options: ["A) True", "B) False"], correct: "A", explanation: "V=IR, I=V/R, R=V/I." }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
      });
      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
