<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Potentiometer & Analog Quiz | Interactive Electronics Learning</title>
    <meta name="description"
        content="Master Arduino analog inputs with our interactive Potentiometer Quiz. 15 questions covering variable resistors, ADC, analogRead() values, and the map() function.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../shared/quiz-style.css">
</head>

<body>

    <h1>🎚️ Potentiometer & Analog Quiz</h1>

    <div class="quiz-container">
        <a href="../../resources/resources.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to
            Resources</a>
        <div class="intro">
            <p>Test your knowledge on how potentiometers work and how Arduino reads analog signals. Perfect for students
                and hobbyists!</p>
        </div>

        <div class="progress-wrapper">
            <div class="progress-container">
                <div id="progress-fill"></div>
            </div>
            <div id="progress-count">0/15 answered</div>
        </div>

        <form id="quiz-form">
            <div id="quiz-area"></div>
            <button type="button" id="submitBtn" onclick="submitQuiz()">Submit Results</button>
        </form>

        <div id="results">
            <div class="score-container">
                <div class="score-circle">0</div>
                <div class="score-label">Your Score</div>
            </div>
            <div class="feedback"></div>
            <div class="action-buttons">
                <a href="" class="secondary-btn" onclick="location.reload(); return false;"><i class="fas fa-redo"></i>
                    Retake Quiz</a>
                <a href="../../resources/resources.html" class="secondary-btn"><i class="fas fa-th-list"></i> More
                    Quizzes</a>
            </div>
            <div id="answer-key" class="answer-key"></div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "1. What is a potentiometer primarily used for in a circuit?", options: ["A) Storing electrical charge", "B) Providing a variable resistance", "C) Amplifying signals", "D) Switching high voltage AC"], correct: "B", explanation: "A potentiometer is a three-terminal resistor with a sliding or rotating contact that forms an adjustable voltage divider." },
            { q: "2. How many terminals (pins) does a standard potentiometer have?", options: ["A) 2", "B) 3", "C) 4", "D) 5"], correct: "B", explanation: "A standard potentiometer has three pins: two outer pins for the full resistance and a middle pin (wiper) for the variable output." },
            { q: "3. Which Arduino function is used to read the value of a potentiometer?", options: ["A) digitalRead()", "B) analogWrite()", "C) analogRead()", "D) readSensor()"], correct: "C", explanation: "The analogRead() function reads the voltage applied to an analog input pin." },
            { q: "4. What is the range of integer values returned by analogRead() on an Arduino Uno?", options: ["A) 0 to 255", "B) 0 to 512", "C) 0 to 1023", "D) -512 to 512"], correct: "C", explanation: "Arduino Uno has a 10-bit ADC, which yields 1024 unique values (0 to 1023)." },
            { q: "5. Which terminal of the potentiometer is usually connected to the Arduino's analog input pin?", options: ["A) Either outer pin", "B) The middle pin (wiper)", "C) All three pins", "D) None of them"], correct: "B", explanation: "The middle pin (wiper) provides the variable voltage that the Arduino reads." },
            { q: "6. If a potentiometer's outer pins are connected to 5V and GND, what voltage range is available at the wiper?", options: ["A) Exactly 5V always", "B) Fixed 2.5V", "C) 0V to 5V", "D) Fixed 0V"], correct: "C", explanation: "Turning the knob moves the wiper between the 5V and GND terminals." },
            { q: "7. What does the map() function do in typical potentiometer projects?", options: ["A) It creates a GPS map", "B) It re-proportion range (e.g. 0-1023 to 0-255)", "C) It prints to the Serial Monitor", "D) It sets the pin mode"], correct: "B", explanation: "map() is used to re-proportion the input range to an output range." },
            { q: "8. What component converts the analog voltage to a digital number?", options: ["A) CPU", "B) PWM Generator", "C) ADC (Analog-to-Digital Converter)", "D) EEPROM"], correct: "C", explanation: "The ADC is the specialized hardware that measures voltage and turns it into a number." },
            { q: "9. To scale 0-1023 to 0-255 (e.g. for LED brightness), what common formula is used?", options: ["A) val * 4", "B) val / 4", "C) val + 255", "D) val - 768"], correct: "B", explanation: "Dividing 1023 by 4 gives approximately 255." },
            { q: "10. What electrical configuration is a potentiometer using to provide variable voltage?", options: ["A) Series Circuit", "B) Parallel Circuit", "C) Voltage Divider", "D) Current Mirror"], correct: "C", explanation: "A potentiometer acts as two resistors in series with a tap in between." },
            { q: "11. If a 10k Ω pot is across 5V and GND, what's the resistance across the outer pins?", options: ["A) Depends on position", "B) Fixed 10k Ω", "C) 0 Ω", "D) Variable"], correct: "B", explanation: "The total resistance across the track is fixed." },
            { q: "12. What happens to analogRead() if you leave an analog pin 'floating' (unconnected)?", options: ["A) Stays at 0", "B) Stays at 1023", "C) Fluctuates randomly", "D) Constant 512"], correct: "C", explanation: "Floating pins pick up EMI and noise." },
            { q: "13. Potentiometers are commonly used for:", options: ["A) Volume control", "B) Sensor calibration", "C) Joystick inputs", "D) All of the above"], correct: "D", explanation: "They are versatile for user-adjustable analog input." },
            { q: "14. T/F: analogRead() handles pin configuration automatically.", options: ["A) True", "B) False"], correct: "A", explanation: "While pinMode is good practice, analogRead handles ADC config." },
            { q: "15. What is the max safe voltage for an Arduino Uno analog pin by default?", options: ["A) 3.3V", "B) 5V", "C) 12V", "D) 24V"], correct: "B", explanation: "Standard reference voltage is 5V." }
        ];

        const quizArea = document.getElementById("quiz-area");
        questions.forEach((q, i) => {
            const div = document.createElement("div");
            div.className = "question";
            div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
                q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
                `</div>`;
            quizArea.appendChild(div);
        });

        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
                document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
                document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
            });
        });

        function submitQuiz() {
            let score = 0;
            let html = '<h2>Detailed Results</h2>';
            questions.forEach((q, i) => {
                const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
                const isCorrect = selected && selected.value === q.correct;
                if (isCorrect) score++;
                html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
            });
            document.querySelector('.score-circle').textContent = score + '/' + questions.length;
            document.getElementById('answer-key').innerHTML = html;
            document.getElementById('quiz-form').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>

</html>
