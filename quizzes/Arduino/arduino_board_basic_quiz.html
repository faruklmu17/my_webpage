<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>🔌 Electronics Basics Quiz | Arduino Fundamentals</title>
<meta content="Test your electronics fundamentals with this quiz covering resistors, LEDs, voltage, current, and breadboards for Arduino projects." name="description"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="../../shared/quiz-style.css" rel="stylesheet"/>
<link href="https://faruk-hasan.com/quizzes/Arduino/arduino_board_basic_quiz.html" rel="canonical"/></head>
<body>
<h1>🔌 Electronics Basics Quiz</h1>
<div class="quiz-container">
<a class="back-link" href="../../resources/resources.html"><i class="fas fa-arrow-left"></i> Back to Resources</a>
<div class="intro">
<p>Check your understanding of resistors, LEDs, voltage, current, and breadboard connections. Essential for any
        Arduino project!</p>
</div>
<div class="progress-wrapper">
<div class="progress-container">
<div id="progress-fill"></div>
</div>
<div id="progress-count">0/15 answered</div>
</div>
<form id="quiz-form">
<div id="quiz-area"></div>
<button id="submitBtn" onclick="submitQuiz()" type="button">Submit Results</button>
</form>
<div id="results">
<div class="score-container">
<div class="score-circle">0</div>
<div class="score-label">Your Score</div>
</div>
<div class="feedback"></div>
<div class="action-buttons">
<a class="secondary-btn" href="" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
<a class="secondary-btn" href="../../resources/resources.html"><i class="fas fa-th-list"></i> More Quizzes</a>
</div>
<div class="answer-key" id="answer-key"></div>
</div>
</div>
<script>
    const questions = [
      { q: "1. What is the purpose of a resistor in a circuit?", options: ["A) To increase current", "B) To limit current flow", "C) To store energy", "D) To generate voltage"], correct: "B", explanation: "Resistors limit current to protect components and set operating points." },
      { q: "2. What happens if an LED is connected without a resistor?", options: ["A) It glows brighter safely", "B) It may burn out due to too much current", "C) It will not turn on", "D) It will blink automatically"], correct: "B", explanation: "LEDs require current limiting; otherwise they can overheat and fail." },
      { q: "3. In an Arduino circuit, where should the LED’s cathode (C) be connected?", options: ["A) To the 5V pin", "B) To the ground (GND)", "C) To digital pin 13", "D) To the resistor"], correct: "B", explanation: "Cathode typically goes to ground; anode goes to the positive side through a resistor." },
      { q: "4. The anode (A) of an LED connects to:", options: ["A) Ground", "B) Negative terminal", "C) Positive voltage through a resistor", "D) Analog input pin"], correct: "C", explanation: "The resistor limits current from the positive supply into the LED’s anode." },
      { q: "5. If voltage increases but resistance stays the same, what happens to the current?", options: ["A) It decreases", "B) It stays the same", "C) It increases", "D) It becomes zero"], correct: "C", explanation: "Ohm’s Law: I = V / R. With R constant, increasing V increases I." },
      { q: "6. Which color wire is typically used for ground in breadboard circuits?", options: ["A) Red", "B) Blue", "C) Green", "D) Black"], correct: "D", explanation: "Convention: black for GND, red for +V." },
      { q: "7. The resistor in this circuit has a value of 220 Ω. What is its main function?", options: ["A) Reduce LED brightness and protect it", "B) Supply more power to the LED", "C) Store charge", "D) Measure voltage drop"], correct: "A", explanation: "A series resistor limits current; brightness drops as current is limited." },
      { q: "8. What does voltage represent in a circuit?", options: ["A) The number of electrons", "B) The push or force that moves electrons", "C) The resistance of the wires", "D) The brightness of the LED"], correct: "B", explanation: "Voltage is the electric potential difference—the 'push'." },
      { q: "9. What happens if you swap the LED’s anode and cathode connections?", options: ["A) It will still work normally", "B) It won’t light up", "C) It will blink faster", "D) It will get brighter"], correct: "B", explanation: "LEDs are polarized; reverse-bias prevents current flow (and light)." },
      { q: "10. In a typical connection, pin 13 of the Arduino is used to:", options: ["A) Power the LED directly", "B) Control the LED as a digital output", "C) Read analog voltage", "D) Connect to ground"], correct: "B", explanation: "Pin 13 can be set HIGH/LOW to switch the LED via a resistor." },
      { q: "11. What are the long horizontal rows on a breadboard usually used for?", options: ["A) Power and ground connections", "B) Data transfer", "C) Analog inputs", "D) Resistor placement only"], correct: "A", explanation: "These are power rails to distribute +V and GND along the board." },
      { q: "12. What are the vertical columns in the center section of a breadboard called?", options: ["A) Power rails", "B) Terminal strips", "C) Connection rails", "D) Bus lines"], correct: "B", explanation: "Terminal strips are the main grid where components connect." },
      { q: "13. How are the holes connected inside a breadboard’s main area (the middle section)?", options: ["A) All holes are connected together", "B) Holes in each row are connected", "C) Holes in each column are connected", "D) Only corner holes are connected"], correct: "C", explanation: "Each 5-hole column is tied together; the center gap separates left/right." },
      { q: "14. If you place a resistor across the gap in the middle of the breadboard, what are you doing?", options: ["A) Creating a short circuit", "B) Connecting components on both sides", "C) Disconnecting both sides", "D) Measuring current flow"], correct: "B", explanation: "Bridging the center gap links separate terminal strips in one path." },
      { q: "15. Why is a breadboard called a 'breadboard'?", options: ["A) It was originally used to make bread", "B) It looks like a loaf of bread", "C) Early experimenters used wooden breadboards to build circuits", "D) It has a bread-like texture"], correct: "C", explanation: "Historically, hobbyists nailed terminals into wooden breadboards to prototype." }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
      });
      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
