<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data & Web Scraping Quiz (20 MCQs)</title>
  <link rel="canonical" href="https://faruk-hasan.com/quizzes/AI/ai_quiz_0_fundamentals.html" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../shared/quiz-style.css">
</head>

<body>

  <h1>📊 Data & Web Scraping Quiz</h1>

  <div class="quiz-container">
    <a href="../../resources/resources.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Resources</a>
    <div class="progress-wrapper">
      <div class="progress-container">
        <div id="progress-fill"></div>
      </div>
      <div id="progress-count">0/20 answered</div>
    </div>

    <form id="quiz-form">
      <div id="quiz-area"></div>
      <button type="button" id="submitBtn" onclick="submitQuiz()">Submit Results</button>
    </form>

    <div id="results">
      <div class="score-container">
        <div class="score-circle">0</div>
        <div class="score-label">Your Score</div>
      </div>
      <div class="feedback"></div>
      <div class="action-buttons">
        <a href="" class="secondary-btn" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
        <a href="../../resources/resources.html" class="secondary-btn"><i class="fas fa-th-list"></i> More Quizzes</a>
      </div>
      <div id="answer-key" class="answer-key"></div>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "1. What is the fundamental difference between 'Structured' and 'Unstructured' data?",
        options: [
          "A) Structured data is high-volume; unstructured is low-volume.",
          "B) Structured data follows a schema (like SQL); unstructured does not (like text/images).",
          "C) Structured data is only found on hard drives; unstructured is only on the web.",
          "D) There is no difference."
        ],
        correct: "B",
        explanation: "Structured data follows a predefined structure or schema, while unstructured data does not have a formal organization."
      },
      {
        q: "2. Which HTTP method is typically used to retrieve data from a server during scraping?",
        options: ["A) POST", "B) GET", "C) DELETE", "D) UPDATE"],
        correct: "B",
        explanation: "The GET method is used to request data from a specified resource."
      },
      {
        q: "3. What does the 'robots.txt' file on a website tell a web scraper?",
        options: [
          "A) It provides the password to the database.",
          "B) It specifies which parts of the site should not be crawled.",
          "C) It lists all the usernames and emails of the site owners.",
          "D) It is a virus intended to stop scrapers."
        ],
        correct: "B",
        explanation: "Robots.txt is a standard used by websites to communicate with web crawlers and other web robots."
      },
      {
        q: "4. In HTML, which tag is most commonly used for defining hyperlinked anchors?",
        options: ["A) <link>", "B) <a>", "C) <href>", "D) <p>"],
        correct: "B",
        explanation: "The <a> (anchor) tag defines a hyperlink."
      },
      {
        q: "5. What is 'Dynamic Content' in the context of web scraping?",
        options: [
          "A) Content that changes color when clicked.",
          "B) Content loaded via JavaScript after the initial HTML page is received.",
          "C) Content that only exists on mobile apps.",
          "D) Images that move (GIFs)."
        ],
        correct: "B",
        explanation: "Dynamic content is content that changes based on user interaction or other factors, often loaded via JS."
      },
      {
        q: "6. Which Python library is most famous for parsing HTML and navigating the parse tree?",
        options: ["A) Pandas", "B) NumPy", "C) BeautifulSoup", "D) PyTorch"],
        correct: "C",
        explanation: "BeautifulSoup is the go-to library for parsing HTML and XML in Python."
      },
      {
        q: "7. A 'CSS Selector' is used in scraping to:",
        options: [
          "A) Change the font size of the scraped data.",
          "B) Target specific HTML elements based on their style, class, or ID.",
          "C) Encrypt the connection to the server.",
          "D) Calculate the average value of a column."
        ],
        correct: "B",
        explanation: "CSS selectors are patterns used to select the elements you want to style or scrape."
      },
      {
        q: "8. What is the main purpose of an API (Application Programming Interface)?",
        options: [
          "A) To create pretty user interfaces.",
          "B) To allow two software applications to communicate with each other in a structured way.",
          "C) To prevent people from visiting a website.",
          "D) To host images."
        ],
        correct: "B",
        explanation: "APIs allow different software systems to interact and share data."
      },
      {
        q: "9. Which format is most commonly used for data exchange in modern APIs?",
        options: ["A) CSV", "B) JSON", "C) PDF", "D) DOCX"],
        correct: "B",
        explanation: "JSON (JavaScript Object Notation) is the most popular format for data exchange."
      },
      {
        q: "10. What does 'Rate Limiting' mean in web scraping?",
        options: [
          "A) The speed at which you can type code.",
          "B) The restriction on the number of requests a client can make to a server in a given time.",
          "C) The price you pay for internet data.",
          "D) The maximum size of the data being downloaded."
        ],
        correct: "B",
        explanation: "Rate limiting prevents servers from being overwhelmed by too many requests."
      },
      {
        q: "11. Which tool is best suited for scraping websites that rely heavily on JavaScript rendering?",
        options: ["A) requests", "B) urllib", "C) Selenium or Playwright", "D) pandas.read_html()"],
        correct: "C",
        explanation: "Selenium and Playwright can control a real browser to render JavaScript."
      },
      {
        q: "12. What is a 'User-Agent' string?",
        options: [
          "A) The user's login password.",
          "B) A string in the HTTP header that identifies the browser or client making the request.",
          "C) The name of the government agency regulating the web.",
          "D) A secret code to skip the robots.txt file."
        ],
        correct: "B",
        explanation: "User-Agent strings tell the server what kind of device/browser is making the request."
      },
      {
        q: "13. In a CSV (Comma-Separated Values) file, what does each row typically represent?",
        options: ["A) A column", "B) A record or data entry", "C) A separate file", "D) A pixel"],
        correct: "B",
        explanation: "Rows in a CSV typically correspond to individual records or observations."
      },
      {
        q: "14. What is the process of 'Cleaning' data in a Data Science workflow?",
        options: [
          "A) Deleting all the data to start over.",
          "B) Handling missing values, removing duplicates, and fixing formatting errors.",
          "C) Running the data through a physical washing machine.",
          "D) Translating the data into a different language."
        ],
        correct: "B",
        explanation: "Data cleaning is the process of fixing or removing incorrect, corrupted, or incomplete data."
      },
      {
        q: "15. Which of these is an example of 'Semi-Structured' data?",
        options: ["A) A relational database (SQL Table)", "B) An XML or JSON file", "C) A physical newspaper", "D) A purely handwritten note"],
        correct: "B",
        explanation: "XML and JSON have structure but don't strictly follow a rigid relational schema."
      },
      {
        q: "16. What is 'Xpath'?",
        options: [
          "A) The path where your Python script is saved.",
          "B) A syntax for navigating through elements and attributes in an XML/HTML document.",
          "C) A new type of high-speed internet.",
          "D) A popular social media platform."
        ],
        correct: "B",
        explanation: "XPath (XML Path Language) is a query language for selecting nodes from an XML/HTML document."
      },
      {
        q: "17. What does the HTTP 404 Status Code represent?",
        options: ["A) OK", "B) Forbidden", "C) Not Found", "D) Internal Server Error"],
        correct: "C",
        explanation: "404 means the server could not find the requested resource."
      },
      {
        q: "18. Why should you use a Proxy or VPN when scraping heavily?",
        options: [
          "A) To make your internet faster.",
          "B) To avoid getting your IP address banned or blocked by the target website.",
          "C) To make the data look more professional.",
          "D) It is mandatory by law."
        ],
        correct: "B",
        explanation: "Proxies hide your real IP address, helping to avoid blocks during high-volume scraping."
      },
      {
        q: "19. Which Python data structure is most similar to a JSON object?",
        options: ["A) List", "B) Tuple", "C) Dictionary", "D) Set"],
        correct: "C",
        explanation: "Python dictionaries use key-value pairs, just like JSON objects."
      },
      {
        q: "20. What is 'Data Latency'?",
        options: [
          "A) The amount of data saved.",
          "B) The time delay between data collection and data availability.",
          "C) The accuracy of the data.",
          "D) The cost of the database."
        ],
        correct: "B",
        explanation: "Latency refers to the delay before a transfer of data begins following an instruction."
      }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';

      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;

        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
      });

      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';

      const percentage = (score / questions.length) * 100;
      let feedbackText = '';
      if (percentage >= 90) feedbackText = 'Excellent! You Have Mastered the Fundamentals.';
      else if (percentage >= 70) feedbackText = 'Good job! You have a solid grasp of these concepts.';
      else feedbackText = 'Keep studying! Data fundamentals are the building blocks of AI.';

      document.querySelector('.feedback').textContent = feedbackText;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>

</html>
