<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Quiz 1: Python Web Scraping | BeautifulSoup &amp; Requests Mastery</title>
<meta content="Test your Python web scraping skills with 15 questions on Requests, BeautifulSoup, and HTML parsing logic." name="description"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="../../shared/quiz-style.css" rel="stylesheet"/>
<link href="https://faruk-hasan.com/quizzes/AI/ai_quiz_1_web_scraping.html" rel="canonical"/></head>
<body>
<h1>🕷️ Web Scraping Mastery Quiz</h1>
<div class="quiz-container">
<a class="back-link" href="../../resources/resources.html"><i class="fas fa-arrow-left"></i> Back to Resources</a>
<div class="intro">
<p>Test your knowledge of Python web scraping techniques, from fetching HTML with Requests to parsing elements
        with BeautifulSoup.</p>
</div>
<div class="progress-wrapper">
<div class="progress-container">
<div id="progress-fill"></div>
</div>
<div id="progress-count">0/15 answered</div>
</div>
<form id="quiz-form">
<div id="quiz-area"></div>
<button id="submitBtn" onclick="submitQuiz()" type="button">Submit Results</button>
</form>
<div id="results">
<div class="score-container">
<div class="score-circle">0</div>
<div class="score-label">Your Score</div>
</div>
<div class="feedback"></div>
<div class="action-buttons">
<a class="secondary-btn" href="" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
<a class="secondary-btn" href="../../resources/resources.html"><i class="fas fa-th-list"></i> More Quizzes</a>
</div>
<div class="answer-key" id="answer-key"></div>
</div>
</div>
<script>
    const questions = [
      { q: "1. T/F: BeautifulSoup is a built-in Python library.", options: ["A) True", "B) False"], correct: "B", explanation: "BeautifulSoup is a third-party library and must be installed via pip." },
      { q: "2. T/F: The requests library is primarily used for HTML parsing.", options: ["A) True", "B) False"], correct: "B", explanation: "Requests is for making HTTP calls; BeautifulSoup is for parsing." },
      { q: "3. T/F: soup.find('p') returns the first paragraph tag in the document.", options: ["A) True", "B) False"], correct: "A" },
      { q: "4. T/F: soup.find_all('p') returns a list of all paragraph tags.", options: ["A) True", "B) False"], correct: "A" },
      { q: "5. T/F: You can use BeautifulSoup to execute JavaScript on a webpage.", options: ["A) True", "B) False"], correct: "B", explanation: "BeautifulSoup only parses static HTML; use Selenium or Playwright for JS execution." },
      { q: "6. T/F: .text property in BS4 returns the HTML tags along with the content.", options: ["A) True", "B) False"], correct: "B", explanation: ".text returns only the visible text content." },
      { q: "7. T/F: HTTP 200 status code means 'Success'.", options: ["A) True", "B) False"], correct: "A" },
      { q: "8. In BeautifulSoup, which method allows you to find elements by CSS class?", options: ["A) soup.class()", "B) soup.get_class()", "C) soup.find(class_='name')", "D) soup.search()"], correct: "C" },
      { q: "9. How do you extract the value of an 'href' attribute from a link tag object?", options: ["A) link.href", "B) link['href']", "C) link.get_href()", "D) link.value"], correct: "B" },
      { q: "10. What is a 'User-Agent' used for in requests headers?", options: ["A) To mimic a browser identity", "B) To store user passwords", "C) To speed up the connection", "D) To encrypt HTML"], correct: "A" },
      { q: "11. Which data structure does BeautifulSoup create to represent the document?", options: ["A) Array", "B) Dictionary", "C) Parse Tree", "D) Linked List"], correct: "C" },
      { q: "12. What does soup.title.string return?", options: ["A) The text content of the <title> tag", "B) The entire <title> tag with HTML", "C) The URL of the page", "D) None of the above"], correct: "A" },
      { q: "13. What happens if you try to scrape a page that is protected by a login using only basic requests.get()?", options: ["A) It logs you in automatically", "B) It gives you the full dashboard", "C) It asks for your password in console", "D) It usually returns the login page HTML"], correct: "D" },
      { q: "14. Which parser is usually faster: 'html.parser' or 'lxml'?", options: ["A) html.parser", "B) lxml", "C) They are the same speed", "D) BS4 doesn't support lxml"], correct: "B" },
      { q: "15. What is the primary use of 'robots.txt' for scrapers?", options: ["A) To provide a list of API keys", "B) To test if the site is a bot", "C) To check which parts of the site are permitted for crawling", "D) To download the site database"], correct: "C" }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation || ''}</em></p>
        </div>`;
      });
      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
