<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Basics Quiz | Free Learning</title>
  <style>
    :root {
      --primary-color: #3776ab;
      --primary-dark: #2b5b84;
      --secondary-color: #f5f7fa;
      --text-color: #333;
      --border-color: #e0e0e0;
      --success-color: #27ae60;
      --error-color: #e74c3c;
      --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      background-color: var(--secondary-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-top: 30px;
      margin-bottom: 30px;
    }

    .quiz-container {
      max-width: 800px;
      margin: 0 auto 50px;
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: var(--box-shadow);
    }

    .question {
      background: #fff;
      padding: 20px;
      margin-bottom: 25px;
      border-radius: 8px;
      border-left: 4px solid var(--primary-color);
      background-color: #f8fbff;
    }

    .question label {
      display: block;
      font-weight: 600;
      margin-bottom: 12px;
      color: #2c3e50;
    }

    code {
      background-color: #eef2f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95em;
      color: #c0392b;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
      outline: none;
      box-shadow: 0 0 8px rgba(55, 118, 171, 0.2);
    }

    #submitBtn {
      display: block;
      width: 100%;
      padding: 16px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    #submitBtn:hover {
      background-color: var(--primary-dark);
    }

    .progress-wrapper {
      position: sticky;
      top: 0;
      z-index: 100;
      background: white;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 30px;
    }

    .progress-container {
      height: 10px;
      background-color: #e0e0e0;
      border-radius: 5px;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      background-color: var(--primary-color);
      width: 0%;
      transition: width 0.3s ease;
    }

    #progress-count {
      text-align: center;
      font-size: 0.9rem;
      margin-top: 5px;
      color: #666;
    }

    #results {
      display: none;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 2px solid var(--border-color);
    }

    .answer-item {
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 6px;
      background-color: #f1f3f5;
      border-left: 4px solid #ced4da;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <h1>Python Basics Quiz</h1>

  <div class="quiz-container">
    <div class="progress-wrapper">
      <div class="progress-container">
        <div id="progress-fill"></div>
      </div>
      <div id="progress-count">0/15 questions answered</div>
    </div>

    <form id="quizForm">
      <div class="question">
        <label for="q1">1. What will be printed when the user enters <code>30</code> in:<br>
          <code>age = input("How old are you? ")<br>print(type(age))</code>?</label>
        <input type="text" id="q1" name="q1" placeholder="Type your answer here..." />
      </div>

      <div class="question">
        <label for="q2">2. If the user types <code>7</code> and <code>5</code> in:<br>
          <code>num1 = int(input("Enter first number: "))<br>num2 = int(input("Enter second number: "))<br>print(num1 + num2)</code><br>
          what is the output? What happens if you omit <code>int()</code>?</label>
        <input type="text" id="q2" name="q2" placeholder="Type your answer here..." />
      </div>

      <div class="question">
        <label for="q3">3. What does this print?<br>
          <code>fruits = ["apple", "banana", "cherry", "date", "elderberry"]<br>print(fruits[1:4])</code></label>
        <input type="text" id="q3" name="q3" placeholder="Type your answer here..." />
      </div>

      <div class="question">
        <label for="q4">4. Which element and value is accessed by:<br>
          <code>nums = [10, 20, 30, 40, 50]<br>print(nums[-3])</code>?</label>
        <input type="text" id="q4" name="q4" placeholder="Type your answer here..." />
      </div>

      <div class="question">
        <label for="q5">5. What happens when you run:<br>
          <code>t = (1, 2, 3)<br>t[0] = 10</code>?</label>
        <input type="text" id="q5" name="q5" placeholder="Type your answer here..." />
      </div>

      <div class="question">
        <label for="q6">6. After this code:<br>
          <code>student = {"name": "Alice", "score": 85}<br>student["score"] += 5<br>print(student)</code><br>
          what is the resulting dictionary?</label>
        <input type="text" id="q6" name="q6" placeholder="Type your answer here..." />
      </div>

      <div class="question">
        <label for="q7">7. What is the type and contents of <code>colors</code>?<br>
          <code>text = "red,green,blue,yellow"<br>colors = text.split(",")</code></label>
        <input type="text" id="q7" name="q7" placeholder="Type your answer here..." />
      </div>

      <div class="question">
        <label for="q8">8. What is the value of <code>sentence</code>?<br>
          <code>words = ["hello", "world"]<br>sentence = " ".join(words)</code></label>
        <input type="text" id="q8" name="q8" placeholder="Type your answer here..." />
      </div>

      <div class="question">
        <label for="q9">9. Show exactly what prints:<br>
          <code>title = "Chapter 1"<br>print(title.center(20, "-"))</code></label>
        <input type="text" id="q9" name="q9" placeholder="Type your answer here..." />
      </div>

      <div class="question">
        <label for="q10">10. What substring is printed?<br>
          <code>s = "abcdefghijklmnopqrstuvwxyz"<br>print(s[5:15:2])</code></label>
        <input type="text" id="q10" name="q10" placeholder="Type your answer here..." />
      </div>

      <div class="question">
        <label for="q11">11. What is the output and element types?<br>
          <code>nums_str = ["1", "2", "3", "4"]<br>nums = list(map(int, nums_str))<br>print(nums)</code></label>
        <input type="text" id="q11" name="q11" placeholder="Type your answer here..." />
      </div>

      <div class="question">
        <label for="q12">12. What does <code>codes</code> contain?<br>
          <code>letters = ['a', 'b', 'c']<br>codes = list(map(lambda x: ord(x), letters))</code></label>
        <input type="text" id="q12" name="q12" placeholder="Type your answer here..." />
      </div>

      <div class="question">
        <label for="q13">13. What is printed?<br>
          <code>data = {"names": ["Alice", "Bob"], "scores": (90, 85)}<br>print(data["names"][1], data["scores"][0])</code></label>
        <input type="text" id="q13" name="q13" placeholder="Type your answer here..." />
      </div>

      <div class="question">
        <label for="q14">14. If the user types <code>pen paper eraser</code> in:<br>
          <code>items = input("Enter items separated by space: ").split()<br>print(items)</code><br>
          what does <code>items</code> become?</label>
        <input type="text" id="q14" name="q14" placeholder="Type your answer here..." />
      </div>

      <div class="question">
        <label for="q15">15. After running:<br>
          <code>raw = "  apple;banana; cherry  "<br>cleaned = ";".join(raw.strip().split(";"))</code><br>
          what is the exact value of <code>cleaned</code>?</label>
        <input type="text" id="q15" name="q15" placeholder="Type your answer here..." />
      </div>

      <button type="submit" id="submitBtn">Submit Answers</button>
    </form>

    <div id="results">
      <h2>Review Your Answers</h2>
      <div id="answersList"></div>
    </div>
  </div>

  <script>
    const totalQ = 15;

    document.querySelectorAll('input[type="text"]').forEach(input => {
      input.addEventListener('input', () => {
        let answered = 0;
        for (let i = 1; i <= totalQ; i++) {
          if (document.getElementById('q' + i).value.trim() !== "") answered++;
        }
        document.getElementById('progress-fill').style.width = (answered / totalQ * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + totalQ + ' questions answered';
      });
    });

    document.getElementById('quizForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const resultsDiv = document.getElementById('results');
      const answersList = document.getElementById('answersList');
      answersList.innerHTML = '';

      for (let i = 1; i <= totalQ; i++) {
        const answer = document.getElementById('q' + i).value.trim();
        const div = document.createElement('div');
        div.className = 'answer-item';
        div.innerHTML = `<strong>Question ${i}:</strong><br>${answer || '<em>(no answer provided)</em>'}`;
        answersList.appendChild(div);
      }

      resultsDiv.style.display = 'block';
      document.getElementById('quizForm').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>

</html>
