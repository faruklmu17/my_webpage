<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Mastery Quiz | Beginner to Intermediate</title>
  <meta name="description"
    content="Test your Python skills with 15 questions on input types, list slicing, dictionaries, map(), and lambda functions.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../shared/quiz-style.css">
  <style>
    code {
      background-color: #f0f3f7;
      padding: 2px 4px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      color: #e74c3c;
    }

    .question-block {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid var(--primary-color);
    }
  </style>
</head>

<body>

  <h1>🐍 Python Mastery Quiz</h1>

  <div class="quiz-container">
    <a href="../../resources/resources.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Resources</a>
    <div class="intro">
      <p>Challenge yourself with these 15 questions covering variable types, list structures, operations, and functional
        programming concepts.</p>
    </div>

    <div class="progress-wrapper">
      <div class="progress-container">
        <div id="progress-fill"></div>
      </div>
      <div id="progress-count">0/15 answered</div>
    </div>

    <form id="quiz-form">
      <div id="quiz-area"></div>
      <button type="button" id="submitBtn" onclick="submitQuiz()">Submit Results</button>
    </form>

    <div id="results">
      <div class="score-container">
        <div class="score-circle">0</div>
        <div class="score-label">Your Score</div>
      </div>
      <div class="feedback"></div>
      <div class="action-buttons">
        <a href="" class="secondary-btn" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
        <a href="../../resources/resources.html" class="secondary-btn"><i class="fas fa-th-list"></i> More Quizzes</a>
      </div>
      <div id="answer-key" class="answer-key"></div>
    </div>
  </div>

  <script>
    const questions = [
      { q: "1. What will be the type of 'age' if the user enters 30? <br><code>age = input('How old are you? ')</code>", options: ["A) <class 'int'>", "B) <class 'str'>", "C) <class 'float'>", "D) 30"], correct: "B", explanation: "The input() function always returns a string in Python 3." },
      { q: "2. What is the output if you omit int() and try to add inputs '7' and '5'?", options: ["A) 12", "B) '75'", "C) Error", "D) None"], correct: "B", explanation: "Adding two strings results in concatenation: '7' + '5' = '75'." },
      { q: "3. What does <code>fruits[1:4]</code> print for<br><code>fruits = ['apple', 'banana', 'cherry', 'date', 'elderberry']</code>?", options: ["A) ['apple', 'banana', 'cherry']", "B) ['banana', 'cherry', 'date']", "C) ['banana', 'cherry', 'date', 'elderberry']", "D) ['cherry', 'date', 'elderberry']"], correct: "B", explanation: "Slicing [1:4] starts at index 1 and goes up to (but excludes) index 4." },
      { q: "4. What is the value of <code>nums[-3]</code> in <code>[10, 20, 30, 40, 50]</code>?", options: ["A) 10", "B) 20", "C) 30", "D) 40"], correct: "C", explanation: "Negative indexing starts from the end: -1 is 50, -2 is 40, -3 is 30." },
      { q: "5. What happens when you run: <code>t = (1, 2); t[0] = 10</code>?", options: ["A) t becomes (10, 2)", "B) t becomes [10, 2]", "C) TypeError: 'tuple' object does not support item assignment", "D) SyntaxError"], correct: "C", explanation: "Tuples are immutable; their elements cannot be changed after creation." },
      { q: "6. What is the score in <code>student</code> after <code>student['score'] += 5</code> if it started at 85?", options: ["A) 85", "B) 90", "C) 5", "D) Error"], correct: "B", explanation: "This correctly updates the value associated with the 'score' key." },
      { q: "7. What does <code>'red,green,blue'.split(',')</code> return?", options: ["A) ('red', 'green', 'blue')", "B) ['red', 'green', 'blue']", "C) 'red green blue'", "D) {'red', 'green', 'blue'}"], correct: "B", explanation: "The split() method returns a list of strings." },
      { q: "8. What is the value of <code>' '.join(['hello', 'world'])</code>?", options: ["A) ['hello', 'world']", "B) 'helloworld'", "C) 'hello world'", "D) 'hello-world'"], correct: "C", explanation: "join() uses the string as a separator between list elements." },
      { q: "9. What does <code>'Hi'.center(10, '-')</code> look like?", options: ["A) ----Hi----", "B) ----Hi---", "C) ---Hi----", "D) HI--------"], correct: "A", explanation: "It centers the string within the total width, padding with the fill character." },
      { q: "10. What is <code>s[5:15:2]</code> for the alphabet 'abcdefg...'?", options: ["A) f h j l n", "B) 'fhjln'", "C) 5 7 9 11 13", "D) 'fghij'"], correct: "B", explanation: "Starts at index 5 ('f'), stops before 15, stepping by 2." },
      { q: "11. What is the result of <code>list(map(int, ['1', '2']))</code>?", options: ["A) ['1', '2']", "B) [1, 2]", "C) (1, 2)", "D) Error"], correct: "B", explanation: "map(int, ...) converts each element in the iterable to an integer." },
      { q: "12. What does <code>list(map(lambda x: ord(x), ['a', 'b']))</code> give?", options: ["A) [97, 98]", "B) ['a', 'b']", "C) [1, 2]", "D) Error"], correct: "A", explanation: "ord() returns the Unicode code point (ASCII) for a character; 'a' is 97." },
      { q: "13. What prints for result of <code>data['names'][1], data['scores'][0]</code> from<br><code>{'names': ['Alice', 'Bob'], 'scores': (90, 85)}</code>?", options: ["A) Alice 90", "B) Bob 90", "C) Bob 85", "D) Alice 85"], correct: "B", explanation: "Access index 1 of 'names' (Bob) and index 0 of 'scores' (90)." },
      { q: "14. If you input 'pen paper' into <code>input().split()</code>, what is the result?", options: ["A) 'pen paper'", "B) ['pen', 'paper']", "C) ('pen', 'paper')", "D) ['p', 'e', 'n', ...]"], correct: "B", explanation: "split() without arguments splits by any whitespace into a list." },
      { q: "15. Result of <code>';'.join(' a ; b '.strip().split(';'))</code>?", options: ["A) 'a;b'", "B) 'a; b'", "C) ' a ; b '", "D) 'a ; b'"], correct: "D", explanation: "strip() removes outer spaces, split(';') yields ['a ', ' b'], then join puts them back: 'a ; b'." }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
      });
      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>

</html>
