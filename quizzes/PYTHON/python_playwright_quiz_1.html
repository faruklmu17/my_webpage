<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>🎯 Playwright + Python Concepts Quiz | Automation Testing</title>
<meta content="Test your web automation knowledge with this Playwright + Python quiz. 10 questions on browser context, locators, and action methods." name="description"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="../../shared/quiz-style.css" rel="stylesheet"/>
<link href="https://faruk-hasan.com/quizzes/PYTHON/python_playwright_quiz_1.html" rel="canonical"/></head>
<body>
<h1>🎯 Playwright &amp; Python Quiz</h1>
<div class="quiz-container">
<a class="back-link" href="../../resources/resources.html"><i class="fas fa-arrow-left"></i> Back to Resources</a>
<div class="intro">
<p>Test your knowledge of web automation using Playwright's Python API. Topics include browser launching,
        locators, and interaction methods.</p>
</div>
<div class="progress-wrapper">
<div class="progress-container">
<div id="progress-fill"></div>
</div>
<div id="progress-count">0/10 answered</div>
</div>
<form id="quiz-form">
<div id="quiz-area"></div>
<button id="submitBtn" onclick="submitQuiz()" type="button">Submit Results</button>
</form>
<div id="results">
<div class="score-container">
<div class="score-circle">0</div>
<div class="score-label">Your Score</div>
</div>
<div class="feedback"></div>
<div class="action-buttons">
<a class="secondary-btn" href="" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
<a class="secondary-btn" href="../../resources/resources.html"><i class="fas fa-th-list"></i> More Quizzes</a>
</div>
<div class="answer-key" id="answer-key"></div>
</div>
</div>
<script>
    const questions = [
      { q: "1. What is the purpose of the <code>sync_playwright()</code> function?", options: ["A) Context for async operations", "B) Launches the Playwright server", "C) Provides a synchronous context for operations", "D) Installs browser drivers"], correct: "C", explanation: "sync_playwright() provides a way to use Playwright without async/await keywords." },
      { q: "2. What does <code>headless=False</code> do when launching a browser?", options: ["A) Background execution", "B) Displays the browser UI (Visible mode)", "C) Disables incognito", "D) Enables mobile emulation"], correct: "B", explanation: "Headless mode is off, so you can see the browser window during testing." },
      { q: "3. What is the role of <code>slow_mo=100</code> in browser launch?", options: ["A) Adds delay (ms) between actions", "B) Limits network bandwidth", "C) Delays page timeout", "D) Reduces CPU priority"], correct: "A", explanation: "slow_mo helps you observe actions by slowing them down by the specified milliseconds." },
      { q: "4. How do you create a new browser tab/page?", options: ["A) browser.open()", "B) browser.new_tab()", "C) browser.new_page()", "D) playwright.tab()"], correct: "C", explanation: "new_page() creates a new Page object within a browser context." },
      { q: "5. Which module is used to import Playwright in Python?", options: ["A) import playwright", "B) from playwright.sync_api import sync_playwright", "C) import playwright.python", "D) from playwright import browser"], correct: "B", explanation: "This is the standard entry point for the synchronous API." },
      { q: "6. What does <code>page.locator(selector)</code> return?", options: ["A) The text of an element", "B) A Locator object for interaction", "C) A boolean if found", "D) The element's CSS"], correct: "B", explanation: "A Locator provides a way to find elements on the page lazily." },
      { q: "7. Which method is used to type text into an input field?", options: ["A) .type()", "B) .fill()", "C) .press()", "D) .input()"], correct: "B", explanation: "fill() is the recommended way to input values into form elements." },
      { q: "8. Why use <code>with sync_playwright() as p:</code>?", options: ["A) It's faster", "B) It automatically cleans up resources (closes browser)", "C) It enables multithreading", "D) It connects to a remote server"], correct: "B", explanation: "The 'with' statement ensures Playwright exits gracefully." },
      { q: "9. How do you take a screenshot of the current page?", options: ["A) page.save()", "B) page.capture()", "C) page.screenshot(path='...')", "D) browser.screenshot()"], correct: "C", explanation: ".screenshot() captures the visible area of the page." },
      { q: "10. Which command installs the necessary browsers for Playwright?", options: ["A) pip install browsers", "B) playwright install", "C) npm install playwright", "D) python setup.py"], correct: "B", explanation: "The CLI command 'playwright install' downloads Chromium, Firefox, and WebKit." }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
      });
      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
