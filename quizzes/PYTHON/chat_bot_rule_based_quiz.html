<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤖 Python Rule-Based Chatbot Quiz | NLP and Logic</title>
  <meta name="description"
    content="Test your understanding of Python rule-based chatbot development. 15 questions on requests, BeautifulSoup, and pattern matching logic.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../shared/quiz-style.css">
</head>

<body>

  <h1>🤖 Python Chatbot Quiz</h1>

  <div class="quiz-container">
    <a href="../../resources/resources.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Resources</a>
    <div class="intro">
      <p>Challenge your knowledge of chatbot logic! This quiz covers making HTTP requests, parsing web data, and
        implementing rule-based response patterns.</p>
    </div>

    <div class="progress-wrapper">
      <div class="progress-container">
        <div id="progress-fill"></div>
      </div>
      <div id="progress-count">0/15 answered</div>
    </div>

    <form id="quiz-form">
      <div id="quiz-area"></div>
      <button type="button" id="submitBtn" onclick="submitQuiz()">Submit Results</button>
    </form>

    <div id="results">
      <div class="score-container">
        <div class="score-circle">0</div>
        <div class="score-label">Your Score</div>
      </div>
      <div class="feedback"></div>
      <div class="action-buttons">
        <a href="" class="secondary-btn" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
        <a href="../../resources/resources.html" class="secondary-btn"><i class="fas fa-th-list"></i> More Quizzes</a>
      </div>
      <div id="answer-key" class="answer-key"></div>
    </div>
  </div>

  <script>
    const questions = [
      { q: "1. What is the purpose of <code>requests.get(url)</code>?", options: ["A) Open a file", "B) Send an HTTP GET request to a URL", "C) Post data to a server", "D) Launch a browser"], correct: "B", explanation: "It fetches resources from the web using the standard GET method." },
      { q: "2. T/F: BeautifulSoup is used to parse HTML content from a website.", options: ["A) True", "B) False"], correct: "A", explanation: "BeautifulSoup extracts structured data from HTML strings." },
      { q: "3. What is the role of an 'intents' variable in a rule-based bot?", options: ["A) Store links", "B) Define patterns and corresponding responses", "C) Store user passwords", "D) Handle database migrations"], correct: "B", explanation: "Intents map what the user says (patterns) to what the bot says (responses)." },
      { q: "4. What type of data usually stores Multiple greeting patterns?", options: ["A) Integer", "B) List of strings", "C) Single Boolean", "D) Float"], correct: "B", explanation: "A list allows for multiple variations like ['hi', 'hello', 'hey']." },
      { q: "5. T/F: <code>[msg.text for msg in tags]</code> is an example of list comprehension.", options: ["A) True", "B) False"], correct: "A", explanation: "This is the concise way to build a new list from an iterable." },
      { q: "6. Which module is required for <code>random.choice()</code>?", options: ["A) time", "B) math", "C) random", "D) sys"], correct: "C" },
      { q: "7. What happens if a user's input matches NO patterns?", options: ["A) Crash", "B) Default 'I don't understand' (if set)", "C) Infinite loop", "D) Variable becomes 'Error'"], correct: "B", explanation: "A robust bot should have a fallback response for unknown inputs." },
      { q: "8. What does <code>.lower()</code> do to user input?", options: ["A) Encrypts it", "B) Makes matching case-insensitive", "C) Deletes it", "D) Checks if it's a number"], correct: "B", explanation: "Normalizing text to lowercase makes pattern matching more reliable." },
      { q: "9. How do you check if a word is inside a user's message?", options: ["A) if 'hi' in message:", "B) if message.has('hi'):", "C) find('hi', message)", "D) match(message, 'hi')"], correct: "A" },
      { q: "10. In rule-based systems, 'Rule' typically refers to:", options: ["A) An 'if-then' condition", "B) A government law", "C) A CSS style", "D) A server timeout"], correct: "A", explanation: "Logic is based on predefined conditions (if X is in input, then Y is response)." },
      { q: "11. T/F: Rule-based bots are better than AI-based bots for complex, open-ended conversations.", options: ["A) True", "B) False"], correct: "B", explanation: "Rules are great for fixed tasks but fail in unpredictable contexts compared to LLMs." },
      { q: "12. What is 'Normalization'?", options: ["A) Increasing font size", "B) Cleaning text (removing punctuation/spaces)", "C) Uploading code", "D) Deleting the database"], correct: "B", explanation: "Normalization helps the bot understand the core meaning without noise." },
      { q: "13. What does <code>r.status_code == 200</code> check?", options: ["A) If the computer is on", "B) If the page was fetched successfully", "C) If the user is logged in", "D) If the file is a PDF"], correct: "B" },
      { q: "14. How do you find all <div> tags using BeautifulSoup?", options: ["A) soup.find('div')", "B) soup.find_all('div')", "C) soup.get('div')", "D) soup.select_all('div')"], correct: "B" },
      { q: "15. What is the key advantage of a rule-based bot?", options: ["A) Predictable and controlled responses", "B) Understanding human emotions", "C) Writing its own code", "D) No programming needed"], correct: "A", explanation: "Since you define every rule, the bot won't 'hallucinate' or give unexpected answers." }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
      });
      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>

</html>
