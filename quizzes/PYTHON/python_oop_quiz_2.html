<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python OOP Quiz 2 | object-oriented programming</title>
  <meta name="description"
    content="Test your knowledge on Python Classes, Inheritance, Polymorphism, and Encapsulation.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../shared/quiz-style.css">
</head>

<body>

  <h1>🐍 Python OOP Quiz</h1>

  <div class="quiz-container">
    <a href="../../resources/resources.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Resources</a>
    <div class="intro">
      <p>Master Object-Oriented Programming concepts in Python, from constructors and 'self' to inheritance and private
        attributes.</p>
    </div>

    <div class="progress-wrapper">
      <div class="progress-container">
        <div id="progress-fill"></div>
      </div>
      <div id="progress-count">0/13 answered</div>
    </div>

    <form id="quiz-form">
      <div id="quiz-area"></div>
      <button type="button" id="submitBtn" onclick="submitQuiz()">Submit Results</button>
    </form>

    <div id="results">
      <div class="score-container">
        <div class="score-circle">0</div>
        <div class="score-label">Your Score</div>
      </div>
      <div class="feedback"></div>
      <div class="action-buttons">
        <a href="" class="secondary-btn" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
        <a href="../../resources/resources.html" class="secondary-btn"><i class="fas fa-th-list"></i> More Quizzes</a>
      </div>
      <div id="answer-key" class="answer-key"></div>
    </div>
  </div>

  <script>
    const questions = [
      { q: "1. What is the main purpose of Object-Oriented Programming (OOP)?", options: ["A) Faster machine code execution", "B) Code reuse and modularity", "C) Automatic UI generation", "D) Eliminating variables"], correct: "B", explanation: "OOP helps organize code into reusable blocks called classes/objects." },
      { q: "2. Which keyword is used to create a class in Python?", options: ["A) make", "B) define", "C) class", "D) object"], correct: "C", explanation: "The 'class' keyword initiates a class definition." },
      { q: "3. Which method serves as the constructor in a Python class?", options: ["A) __new__()", "B) constructor()", "C) init()", "D) __init__()"], correct: "D", explanation: "__init__ is called when an instance (object) is created." },
      { q: "4. What does 'self' refer to inside a class method?", options: ["A) The class keyword", "B) The parent module", "C) The current object instance", "D) The global scope"], correct: "C", explanation: "self allows access to the specific object's attributes and methods." },
      { q: "5. What is the primary use of Inheritance?", options: ["A) Creating new modules", "B) Hiding data (Encapsulation)", "C) Creating child classes from parent classes", "D) Speeding up loops"], correct: "C", explanation: "It allows a class to derive attributes/methods from another class." },
      { q: "6. T/F: You can have more than one __init__ constructor in a single Python class.", options: ["A) True", "B) False"], correct: "B", explanation: "Python doesn't support method overloading like C++; the last definition wins." },
      { q: "7. T/F: Private attributes (conventionally) in Python start with a single underscore (_).", options: ["A) True", "B) False"], correct: "A", explanation: "A single underscore is a convention for internal/protected use." },
      { q: "8. T/F: The 'Super()' function is used to call methods dari the constructor of the parent class.", options: ["A) True", "B) False"], correct: "A", explanation: "super() allows calling the parent's methods (like __init__)." },
      { q: "9. T/F: Polymorphism allows different classes to have methods with the same name.", options: ["A) True", "B) False"], correct: "A", explanation: "It enables a single interface to represent different underlying types." },
      { q: "10. In OOP, 'wrapping' data and methods into a single unit is called:", options: ["A) Inheritance", "B) Abstraction", "C) Encapsulation", "D) Composition"], correct: "C", explanation: "Encapsulation bundles data and the methods that operate on it." },
      { q: "11. To create an object of class Dog, you use:", options: ["A) my_dog = Dog()", "B) my_dog = new Dog", "C) my_dog = create Dog", "D) my_dog = Dog.new()"], correct: "A", explanation: "Calling the class like a function creates a new instance." },
      { q: "12. What is an 'Attribute'?", options: ["A) A function in a class", "B) A variable inside a class object", "C) A type of loop", "D) A class name"], correct: "B", explanation: "Attributes store the state/data of an object." },
      { q: "13. What happens if a child class defines a method with the same name as the parent?", options: ["A) Syntax Error", "B) Method Overriding", "C) Both run simultaneously", "D) Parent method is deleted"], correct: "B", explanation: "The child's implementation replaces (overrides) the parent's." }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
      });
      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>

</html>
