<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐍 Python Functions & Decorators Quiz | Advanced Python</title>
  <meta name="description"
    content="Test your knowledge of Python functions, closures, and decorators with this 15-question advanced quiz.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../shared/quiz-style.css">
</head>

<body>

  <h1>🐍 Python Functions & Decorators</h1>

  <div class="quiz-container">
    <a href="../../resources/resources.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Resources</a>
    <div class="intro">
      <p>Master the power of Python decorators and functional programming. This quiz covers higher-order functions,
        wrapping, and the @decorator syntax.</p>
    </div>

    <div class="progress-wrapper">
      <div class="progress-container">
        <div id="progress-fill"></div>
      </div>
      <div id="progress-count">0/15 answered</div>
    </div>

    <form id="quiz-form">
      <div id="quiz-area"></div>
      <button type="button" id="submitBtn" onclick="submitQuiz()">Submit Results</button>
    </form>

    <div id="results">
      <div class="score-container">
        <div class="score-circle">0</div>
        <div class="score-label">Your Score</div>
      </div>
      <div class="feedback"></div>
      <div class="action-buttons">
        <a href="" class="secondary-btn" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
        <a href="../../resources/resources.html" class="secondary-btn"><i class="fas fa-th-list"></i> More Quizzes</a>
      </div>
      <div id="answer-key" class="answer-key"></div>
    </div>
  </div>

  <script>
    const questions = [
      { q: "1. What is a class in Python?", options: ["A) A blueprint for creating objects", "B) A built-in data type for storing multiple values", "C) A special kind of function", "D) A syntax for looping over items"], correct: "A", explanation: "Classes define the structure and behavior of objects." },
      { q: "2. Which statement best describes a Python object?", options: ["A) An instance created from a class", "B) A collection of unrelated variables", "C) A keyword used to define functions", "D) A file containing Python code"], correct: "A", explanation: "Objects are data structures created based on class blueprints." },
      { q: "3. How would you define a function in Python?", options: ["A) A named block of reusable code", "B) A fixed value stored in memory", "C) A container for modules", "D) A loop that runs indefinitely"], correct: "A", explanation: "Functions are modular blocks that perform specific tasks when called." },
      { q: "4. When you assign a function to a variable without using parentheses, what are you storing?", options: ["A) The function object itself", "B) The result of calling the function", "C) An empty string", "D) A syntax error"], correct: "A", explanation: "Functions are first-class objects; you can pass them around like values." },
      { q: "5. In a function definition, what do we call the placeholders listed inside the parentheses?", options: ["A) Parameters", "B) Arguments", "C) Returns", "D) Decorators"], correct: "A", explanation: "Parameters are variables in the definition; arguments are values passed in." },
      { q: "6. When you provide actual values to a function call, what are those values called?", options: ["A) Arguments", "B) Parameters", "C) Variables", "D) Objects"], correct: "A", explanation: "Arguments are the context/data you supply to the function's parameters." },
      { q: "7. What does a return statement do inside a function?", options: ["A) Sends a value back to the caller", "B) Stops the entire program", "C) Prints text to the console", "D) Defines a new variable"], correct: "A", explanation: "It exits the function and passes data back to the point where it was called." },
      { q: "8. Which concept involves passing a function object to another function as an input?", options: ["A) Higher-order programming", "B) Polymorphism", "C) Recursion", "D) Multithreading"], correct: "A", explanation: "Higher-order functions take other functions as arguments or return them." },
      { q: "9. What term describes a function defined inside another function?", options: ["A) Nested function", "B) Generator function", "C) Static method", "D) Abstract method"], correct: "A", explanation: "Nested (or inner) functions are defined within the scope of an outer function." },
      { q: "10. What is a wrapper function?", options: ["A) A function that executes code before/after calling another function", "B) A function without any parameters", "C) A function that handles exceptions", "D) A function that only accepts integers"], correct: "A", explanation: "Wrappers extend or modify the behavior of the original function." },
      { q: "11. If you attempt to call an inner function before it is defined, what error occurs?", options: ["A) NameError", "B) TypeError", "C) ValueError", "D) ZeroDivisionError"], correct: "A", explanation: "Python reads definitions sequentially; the name must exist before being used." },
      { q: "12. What happens when you print a function object without parentheses?", options: ["A) You see its representation (e.g., <function ...>)", "B) It executes and prints output", "C) Python concatenates it", "D) SyntaxError"], correct: "A", explanation: "Printing the object itself shows its memory address and identity." },
      { q: "13. Which built-in function confirms that everything in Python is an object?", options: ["A) type()", "B) instanceof()", "C) kind()", "D) objectof()"], correct: "A", explanation: "type() reveals the underlying class of any Python entity." },
      { q: "14. Which example illustrates passing a function object as a parameter?", options: ["A) def apply(func, x): return func(x)", "B) def apply(x, y): return x + y", "C) def apply(): print('Hello')", "D) def apply(func()): return x"], correct: "A", explanation: "Here, 'func' is a placeholder for a function to be executed later." },
      { q: "15. What does a decorator syntactically do in Python?", options: ["A) Wrap another function to modify its behavior", "B) Change the class of an object", "C) Inline C code", "D) Automatically document functions"], correct: "A", explanation: "Decorators provide a clean syntax (@) for higher-order function wrapping." }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
      });
      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>

</html>
