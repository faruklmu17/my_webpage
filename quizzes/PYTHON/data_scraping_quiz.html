<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔍 Python Dictionary Quiz | Beginner to Advanced</title>
  <style>
    :root {
      --primary-color: #3f51b5;
      --primary-dark: #303f9f;
      --secondary-color: #f5f7fa;
      --text-color: #333;
      --border-color: #e0e0e0;
      --success-color: #27ae60;
      --error-color: #e74c3c;
      --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      background-color: var(--secondary-color);
      color: var(--text-color);
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 30px;
    }

    .quiz-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      padding: 25px;
      box-shadow: var(--box-shadow);
    }

    .question {
      background: #fff;
      padding: 20px;
      margin-bottom: 25px;
      border-radius: 8px;
      border-left: 4px solid var(--primary-color);
      background-color: #f9fbff;
    }

    .options label {
      display: block;
      padding: 10px;
      margin-bottom: 5px;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      cursor: pointer;
    }

    .options label:hover {
      background-color: #e8eaf6;
    }

    #submitBtn {
      display: block;
      width: 100%;
      padding: 15px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    #submitBtn:hover {
      background-color: var(--primary-dark);
    }

    .progress-wrapper {
      position: sticky;
      top: 0;
      z-index: 100;
      background: white;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .progress-container {
      height: 10px;
      background-color: #e0e0e0;
      border-radius: 5px;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      background-color: var(--primary-color);
      width: 0%;
      transition: width 0.3s ease;
    }

    #progress-count {
      text-align: center;
      font-size: 0.9rem;
      margin-top: 5px;
      color: #666;
    }

    #results {
      display: none;
      margin-top: 30px;
    }

    .score-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--primary-color);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 10px;
    }

    .answer-item {
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      border-left: 3px solid #ccc;
    }

    .answer-item.correct {
      background-color: #e8f5e9;
      border-left-color: var(--success-color);
    }

    .answer-item.incorrect {
      background-color: #ffebee;
      border-left-color: var(--error-color);
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <h1>🔍 Python Dictionary Quiz</h1>

  <div class="quiz-container">
    <div class="progress-wrapper">
      <div class="progress-container">
        <div id="progress-fill"></div>
      </div>
      <div id="progress-count">0/15 answered</div>
    </div>

    <div id="quiz-area"></div>
    <button type="button" id="submitBtn" onclick="checkAnswers()">Submit Answers</button>

    <div id="results">
      <div class="score-circle">0</div>
      <div id="answer-key"></div>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "1. What is the correct syntax to create a dictionary with keys 'name' and 'age'?",
        options: ["A) dict = ['name': 'Alice', 'age': 25]", "B) dict = ('name': 'Alice', 'age': 25)", "C) dict = {'name': 'Alice', 'age': 25}", "D) dict = name='Alice', age=25"],
        correct: "C"
      },
      {
        q: "2. What is returned by my_dict.get('key') if the key doesn't exist?",
        options: ["A) 0", "B) Error", "C) None", "D) False"],
        correct: "C"
      },
      {
        q: "3. What does len({'a': 1, 'b': 2, 'c': 3}) return?",
        options: ["A) 1", "B) 2", "C) 3", "D) 4"],
        correct: "C"
      },
      {
        q: "4. How do you update the value of an existing key in a dictionary?",
        options: ["A) my_dict.updateValue('key', newValue)", "B) my_dict.key = newValue", "C) my_dict['key'] = newValue", "D) update(my_dict, 'key', newValue)"],
        correct: "C"
      },
      {
        q: "5. How do you loop through both keys and values of a dictionary?",
        options: ["A) for item in dict:", "B) for key, value in dict.items():", "C) for key in dict.values():", "D) for key, value in dict:"],
        correct: "B"
      },
      {
        q: "6. What does this print? for k in {'x': 1, 'y': 2}: print(k)",
        options: ["A) x y", "B) 1 2", "C) x:1 y:2", "D) dict keys"],
        correct: "A"
      },
      {
        q: "7. What does dict.items() return?",
        options: ["A) Only keys", "B) Only values", "C) Key-value pairs as tuples", "D) Dictionary length"],
        correct: "C"
      },
      {
        q: "8. How do you add a new key 'city' with value 'NYC' to a dictionary named user?",
        options: ["A) user.add('city', 'NYC')", "B) user['city'] = 'NYC'", "C) user.insert('city', 'NYC')", "D) user.city = 'NYC'"],
        correct: "B"
      },
      {
        q: "9. Access the value 30 in {'scores': {'math': 30}}",
        options: ["A) scores['math']", "B) dict['math']", "C) dict['scores']['math']", "D) dict.scores.math"],
        correct: "C"
      },
      {
        q: "10. What does this output? d = {'a': 1}; ref = d; ref['b'] = 2; print(d)",
        options: ["A) {'a': 1}", "B) {'b': 2}", "C) {'a': 1, 'b': 2}", "D) Error"],
        correct: "C"
      },
      {
        q: "11. How to print all items from {'fruits': ['apple', 'banana'], 'veggies': ['carrot']}?",
        options: ["A) for x in dict:", "B) for k, v in dict.items(): for item in v: print(item)", "C) print(dict)", "D) dict.each()"],
        correct: "B"
      },
      {
        q: "12. What does this print? info = {'students': [{'name': 'Alice', 'grade': 90}]} print(info['students'][0]['grade'])",
        options: ["A) 90", "B) Alice", "C) students", "D) Error"],
        correct: "A"
      },
      {
        q: "13. Which type CANNOT be used as a dictionary key?",
        options: ["A) int", "B) string", "C) tuple", "D) list"],
        correct: "D"
      },
      {
        q: "14. What happens if you call dict.pop('key') on a missing key?",
        options: ["A) Returns None", "B) Raises KeyError", "C) Deletes dict", "D) Returns 'key'"],
        correct: "B"
      },
      {
        q: "15. How to print all inner key-values from nested = {'a': {'x': 1}, 'b': {'y': 2}}?",
        options: ["A) for k in nested:", "B) nested.items()", "C) for outer, inner in nested.items(): for key, val in inner.items(): print(key, val)", "D) print(nested)"],
        correct: "C"
      }
    ];

    const quizDiv = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const id = `q${i + 1}`;
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map(opt => `<label><input type="radio" name="${id}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizDiv.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / 15 * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/15 answered';
      });
    });

    function checkAnswers() {
      let score = 0;
      let html = '<h3>Answer Key</h3>';

      questions.forEach((q, i) => {
        const id = `q${i + 1}`;
        const selected = document.querySelector(`input[name="${id}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;

        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? '✅' : '❌'}<br>
          Correct Answer: (${q.correct})
        </div>`;
      });

      document.querySelector('.score-circle').textContent = score + '/15';
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-area').style.display = 'none';
      document.getElementById('submitBtn').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>

</html>
