<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕷️ Python Data Scraping Quiz | Web Scraping Mastery</title>
  <meta name="description"
    content="Test your Python web scraping skills with 15 questions on Requests, BeautifulSoup, and HTML parsing logic.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../shared/quiz-style.css">
</head>

<body>

  <h1>🕷️ Data Scraping Quiz</h1>

  <div class="quiz-container">
    <a href="../../resources/resources.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Resources</a>
    <div class="intro">
      <p>Test your knowledge of Python web scraping techniques, from fetching HTML with Requests to parsing elements
        with BeautifulSoup.</p>
    </div>

    <div class="progress-wrapper">
      <div class="progress-container">
        <div id="progress-fill"></div>
      </div>
      <div id="progress-count">0/15 answered</div>
    </div>

    <form id="quiz-form">
      <div id="quiz-area"></div>
      <button type="button" id="submitBtn" onclick="submitQuiz()">Submit Results</button>
    </form>

    <div id="results">
      <div class="score-container">
        <div class="score-circle">0</div>
        <div class="score-label">Your Score</div>
      </div>
      <div class="feedback"></div>
      <div class="action-buttons">
        <a href="" class="secondary-btn" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
        <a href="../../resources/resources.html" class="secondary-btn"><i class="fas fa-th-list"></i> More Quizzes</a>
      </div>
      <div id="answer-key" class="answer-key"></div>
    </div>
  </div>

  <script>
    const questions = [
      { q: "1. Which library is most commonly used to send HTTP requests in Python?", options: ["A) BeautifulSoup", "B) Requests", "C) Selenium", "D) Pandas"], correct: "B", explanation: "The 'requests' library is the standard for making HTTP calls." },
      { q: "2. What status code indicates a successful HTTP request?", options: ["A) 404", "B) 500", "C) 200", "D) 301"], correct: "C", explanation: "200 OK means the request was fulfilled successfully." },
      { q: "3. How do you access the HTML text from a requests response object 'r'?", options: ["A) r.html", "B) r.content", "C) r.text", "D) r.get_text()"], correct: "C", explanation: "r.text contains the decoded content of the response." },
      { q: "4. Which BeautifulSoup method finds the FIRST occurrence of a tag?", options: ["A) find_all()", "B) find_one()", "C) find()", "D) select()"], correct: "C", explanation: "find() returns only the first matching element." },
      { q: "5. How do you find all <a> tags with the class 'link' using BeautifulSoup?", options: ["A) soup.find_all('a', class_='link')", "B) soup.find_all('a', 'link')", "C) soup.select('.link')", "D) All of the above"], correct: "D", explanation: "Both find_all with keyword arguments and CSS selectors (select) work." },
      { q: "6. What does the '.text' property do on a BeautifulSoup element?", options: ["A) Returns the raw HTML", "B) Returns only the visible text content", "C) Changes the font", "D) Returns a list of tags"], correct: "B", explanation: "It strips away all HTML tags and leaves just the text inside." },
      { q: "7. Which library is best for scraping websites that require JavaScript execution?", options: ["A) Requests", "B) Selenium or Playwright", "C) LXML", "D) Urllib"], correct: "B", explanation: "Selenium and Playwright can control real browsers to execute JS." },
      { q: "8. What is 'Robots.txt'?", options: ["A) A list of AI bots", "B) A file telling crawlers which pages to avoid", "C) A Python script", "D) A server error"], correct: "B", explanation: "It's a standard that websites use to guide web robots." },
      { q: "9. How do you extract the value of an 'href' attribute from a tag object 'link'?", options: ["A) link['href']", "B) link.get('href')", "C) Both A and B", "D) link.href"], correct: "C", explanation: "BS4 elements behave like dictionaries for attributes; .get() is safer." },
      { q: "10. Which parser is generally considered the fastest in BeautifulSoup?", options: ["A) html.parser", "B) lxml", "C) html5lib", "D) xml.parser"], correct: "B", explanation: "lxml is a C-based parser and is much faster than the built-in one." },
      { q: "11. What is 'User-Agent' in a request header?", options: ["A) Your username", "B) A string identifying your browser/client", "C) The website URL", "D) A security key"], correct: "B", explanation: "It helps servers identify the device/browser making the request." },
      { q: "12. How do you handle pagination while scraping?", options: ["A) Use a while loop to change the page parameter", "B) Click every link on the page", "C) Restart the script 10 times", "D) You can't scrap multiple pages"], correct: "A", explanation: "Typically you adjust the URL (e.g., page=2) in a loop." },
      { q: "13. What is 'Rate Limiting'?", options: ["A) Increasing scraping speed", "B) Restricting the number of requests per second", "C) A type of database", "D) Encrypting data"], correct: "B", explanation: "Servers limit requests from one IP to prevent overload or scraping." },
      { q: "14. Which method is used to get JSON data from a requests response?", options: ["A) r.json()", "B) json.parse(r)", "C) r.to_json()", "D) r.get_json"], correct: "A", explanation: "r.json() automatically decodes a JSON response into a Python dict/list." },
      { q: "15. Why should you use 'time.sleep()' during scraping?", options: ["A) To speed up execution", "B) To avoid overwhelming the server (be polite)", "C) To clear the cache", "D) To save electricity"], correct: "B", explanation: "Polite scrapers add delays to avoid being blocked or crashing servers." }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
      });
      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>

</html>
