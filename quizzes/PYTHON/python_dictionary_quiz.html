<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔍 Python Dictionary Quiz | Beginner to Advanced</title>
  <meta name="description"
    content="A 15-question Python dictionary quiz with questions on syntax, nested dictionaries, .items(), and loops.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../shared/quiz-style.css">
</head>

<body>

  <h1>🔍 Python Dictionary Quiz</h1>

  <div class="quiz-container">
    <a href="../../resources/resources.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Resources</a>
    <div class="intro">
      <p>Test your Python dictionary skills with 15 questions on keys, values, .items(), and nested structures.</p>
    </div>

    <div class="progress-wrapper">
      <div class="progress-container">
        <div id="progress-fill"></div>
      </div>
      <div id="progress-count">0/15 answered</div>
    </div>

    <form id="quiz-form">
      <div id="quiz-area"></div>
      <button type="button" id="submitBtn" onclick="submitQuiz()">Submit Results</button>
    </form>

    <div id="results">
      <div class="score-container">
        <div class="score-circle">0</div>
        <div class="score-label">Your Score</div>
      </div>
      <div class="feedback"></div>
      <div class="action-buttons">
        <a href="" class="secondary-btn" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
        <a href="../../resources/resources.html" class="secondary-btn"><i class="fas fa-th-list"></i> More Quizzes</a>
      </div>
      <div id="answer-key" class="answer-key"></div>
    </div>
  </div>

  <script>
    const questions = [
      { q: "1. What is the correct syntax to create a dictionary with keys 'name' and 'age'?", options: ["A) dict = ['name': 'Alice', 'age': 25]", "B) dict = ('name': 'Alice', 'age': 25)", "C) dict = {'name': 'Alice', 'age': 25}", "D) dict = name='Alice', age=25"], correct: "C", explanation: "Dictionaries use curly braces {} and colon : to separate keys and values." },
      { q: "2. What is returned by my_dict.get('key') if the key doesn't exist?", options: ["A) 0", "B) Error", "C) None", "D) False"], correct: "C", explanation: "The .get() method returns None (or a specified default) instead of raising an error." },
      { q: "3. What does len({'a': 1, 'b': 2, 'c': 3}) return?", options: ["A) 1", "B) 2", "C) 3", "D) 4"], correct: "C", explanation: "len() returns the number of key-value pairs in the dictionary." },
      { q: "4. How do you update the value of an existing key in a dictionary?", options: ["A) my_dict.updateValue('key', newValue)", "B) my_dict.key = newValue", "C) my_dict['key'] = newValue", "D) update(my_dict, 'key', newValue)"], correct: "C", explanation: "Standard bracket notation is used to both set and update values." },
      { q: "5. How do you loop through both keys and values of a dictionary?", options: ["A) for item in dict:", "B) for key, value in dict.items():", "C) for key in dict.values():", "D) for key, value in dict:"], correct: "B", explanation: ".items() provides an iterable of (key, value) tuples." },
      { q: "6. What does this print? for k in {'x': 1, 'y': 2}: print(k)", options: ["A) x y", "B) 1 2", "C) x:1 y:2", "D) dict keys"], correct: "A", explanation: "Iterating directly over a dictionary yields its keys." },
      { q: "7. What does dict.items() return?", options: ["A) Only keys", "B) Only values", "C) Key-value pairs as tuples", "D) Dictionary length"], correct: "C", explanation: "It returns a view object that displays a list of a dictionary's item-tuples." },
      { q: "8. How to add a new key 'city' with value 'NYC' to user dictionary?", options: ["A) user.add('city', 'NYC')", "B) user['city'] = 'NYC'", "C) user.insert('city', 'NYC')", "D) user.city = 'NYC'"], correct: "B", explanation: "Assigning to a non-existent key adds it to the dictionary." },
      { q: "9. Access the value 30 in {'scores': {'math': 30}}", options: ["A) scores['math']", "B) dict['math']", "C) dict['scores']['math']", "D) dict.scores.math"], correct: "C", explanation: "You must chain the brackets for nested structures." },
      { q: "10. What does this output? d = {'a': 1}; ref = d; ref['b'] = 2; print(d)", options: ["A) {'a': 1}", "B) {'b': 2}", "C) {'a': 1, 'b': 2}", "D) Error"], correct: "C", explanation: "Dictionaries are mutable; ref points to the same object as d." },
      { q: "11. How to print all items from {'f': ['a', 'b']}?", options: ["A) for x in dict:", "B) for k, v in dict.items(): for i in v: print(i)", "C) print(dict)", "D) dict.each()"], correct: "B", explanation: "Iterate through items, then sub-iterate through the list values." },
      { q: "12. What does this print? info = {'students': [{'name': 'Alice', 'grade': 90}]} print(info['students'][0]['grade'])", options: ["A) 90", "B) Alice", "C) students", "D) Error"], correct: "A", explanation: "Access the list value by index 0, then the dictionary key 'grade'." },
      { q: "13. Which type CANNOT be used as a dictionary key?", options: ["A) int", "B) string", "C) tuple", "D) list"], correct: "D", explanation: "Dictionary keys must be hashable; lists are mutable and not hashable." },
      { q: "14. What happens if you call dict.pop('key') on a missing key?", options: ["A) Returns None", "B) Raises KeyError", "C) Deletes dict", "D) Returns 'key'"], correct: "B", explanation: ".pop() raises KeyError if the key is missing and no default is provided." },
      { q: "15. How to print inner key-values from {'a': {'x': 1}}?", options: ["A) for k in nested:", "B) nested.items()", "C) for out, inn in nested.items(): for k, v in inn.items(): print(k, v)", "D) print(nested)"], correct: "C", explanation: "Two loops are needed to reach the innermost key-value pairs." }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0)}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
      });
      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>

</html>
