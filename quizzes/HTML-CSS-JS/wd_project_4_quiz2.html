<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JavaScript Concepts &amp; Web Interactions Quiz | Web Dev Project 4</title>
<meta content="Test your understanding of JavaScript functionality and how it interacts with web elements. 20+ questions on events, DOM, and JS methods." name="description"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="../../shared/quiz-style.css" rel="stylesheet"/>
<link href="https://faruk-hasan.com/quizzes/HTML-CSS-JS/wd_project_4_quiz2.html" rel="canonical"/></head>
<body>
<h1>🎚️ JS &amp; Web Interactions Quiz</h1>
<div class="quiz-container">
<a class="back-link" href="../../resources/resources.html"><i class="fas fa-arrow-left"></i> Back to
            Resources</a>
<div class="intro">
<p>Test your understanding of JavaScript functionality and how it interacts with web elements (DOM, Events,
                URL handling).</p>
</div>
<div class="progress-wrapper">
<div class="progress-container">
<div id="progress-fill"></div>
</div>
<div id="progress-count">0/21 answered</div>
</div>
<form id="quiz-form">
<div id="quiz-area"></div>
<button id="submitBtn" onclick="submitQuiz()" type="button">Submit Results</button>
</form>
<div id="results">
<div class="score-container">
<div class="score-circle">0</div>
<div class="score-label">Your Score</div>
</div>
<div class="feedback"></div>
<div class="action-buttons">
<a class="secondary-btn" href="" onclick="location.reload(); return false;"><i class="fas fa-redo"></i>
                    Retake Quiz</a>
<a class="secondary-btn" href="../../resources/resources.html"><i class="fas fa-th-list"></i> More
                    Quizzes</a>
</div>
<div class="answer-key" id="answer-key"></div>
</div>
</div>
<script>
        const questions = [
            { q: "1. The onchange event happens when you pick something from a dropdown menu.", options: ["A) True", "B) False"], correct: "A", explanation: "onchange triggers when a user changes the selection." },
            { q: "2. You can change the text inside a paragraph using .value.", options: ["A) True", "B) False"], correct: "B", explanation: "Use textContent or innerHTML for paragraph text; .value is for inputs." },
            { q: "3. The command parseFloat(\"2.00\") gives you a number.", options: ["A) True", "B) False"], correct: "A", explanation: "parseFloat converts a string to a decimal point number." },
            { q: "4. We can get information from the URL using URLSearchParams.", options: ["A) True", "B) False"], correct: "A", explanation: "This API extracts query parameters from URLs." },
            { q: "5. Using onclick in HTML is not allowed in HTML5.", options: ["A) True", "B) False"], correct: "B", explanation: "onclick is still valid HTML5, though addEventListener is more modern." },
            { q: "6. Math.random() gives a number between 0 and 1, like 0.57.", options: ["A) True", "B) False"], correct: "A", explanation: "It returns a floating-point, pseudo-random number in the range [0, 1)." },
            { q: "7. The data-* attribute lets you store extra info in HTML tags.", options: ["A) True", "B) False"], correct: "A", explanation: "data-* attributes are special storage for custom information." },
            { q: "8. You should use parseInt() to turn '3.14' into a float.", options: ["A) True", "B) False"], correct: "B", explanation: "parseInt() returns an integer (3); parseFloat() returns the decimal." },
            { q: "9. You can use textContent to change what shows up on a page.", options: ["A) True", "B) False"], correct: "A", explanation: "It sets the UI text of a node." },
            { q: "10. window.location.href helps you move to another web page.", options: ["A) True", "B) False"], correct: "A", explanation: "Assigning to it navigates the browser to the new URL." },
            { q: "11. What does Math.floor(Math.random()*900)+100 do?", options: ["a) Random decimal 0-999", "b) Random whole number 100-999", "c) Always gives 100", "d) Error"], correct: "B", explanation: "It generates a random integer within that specific range." },
            { q: "12. What does encodeURIComponent help with?", options: ["a) Decode HTML", "b) Remove styles", "c) Make data safe for URLs", "d) Encrypt data"], correct: "C", explanation: "It encodes data so special characters don't break URL logic." },
            { q: "13. Which HTML tag do we use to add JavaScript code?", options: ["a) <javascript>", "b) <script>", "c) <js>", "d) <code>"], correct: "B", explanation: "The <script> tag is the standard for JS inclusion." },
            { q: "14. What does the # symbol mean in querySelector('#id')?", options: ["a) Tag name", "b) Class name", "c) ID name", "d) Data attribute"], correct: "C", explanation: "# indicates an ID selector." },
            { q: "15. Why use parseFloat in a shopping cart project?", options: ["a) Get integers", "b) Round decimals", "c) Change text number to decimal number", "d) Add dollar signs"], correct: "C", explanation: "Ensures calculations work on numerical decimals rather than strings." },
            { q: "16. Correct way to change text inside a <p> element?", options: ["a) p.value = ...", "b) p.textContent = ...", "c) p.input = ...", "d) p.setText = ..."], correct: "B", explanation: "textContent is the standard property for text nodes." },
            { q: "17. What does .textContent = '...' do to an element?", options: ["a) Changes visible text", "b) Hides element", "c) Sends data", "d) Deletes element"], correct: "A", explanation: "It updates the UI for the user." },
            { q: "18. Which sends the user to a new page?", options: ["a) document.reload()", "b) location.go()", "c) window.location.href = 'url'", "d) document.goto()"], correct: "C", explanation: "This is the primary way to redirect via JS." },
            { q: "19. If a price value is missing in a dynamic link, what's a good fallback?", options: ["a) 0.00", "b) null", "c) Error message", "d) All of the above"], correct: "D", explanation: "Handling missing data gracefully prevents app crashes." },
            { q: "20. In HTML, what attribute stores custom data?", options: ["a) data-*", "b) custom-data", "c) dataset", "d) info"], correct: "A", explanation: "data-* is the standard HTML5 way." },
            { q: "21. Which method is used to parse a JSON string into an object?", options: ["a) JSON.stringify()", "b) JSON.parse()", "c) JSON.toObject()", "d) JSON.parseString()"], correct: "B", explanation: "JSON.parse() turns strings back into objects." }
        ];

        const quizArea = document.getElementById("quiz-area");
        questions.forEach((q, i) => {
            const div = document.createElement("div");
            div.className = "question";
            div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
                q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0).toUpperCase()}"> ${opt}</label>`).join("") +
                `</div>`;
            quizArea.appendChild(div);
        });

        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
                document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
                document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
            });
        });

        function submitQuiz() {
            let score = 0;
            let html = '<h2>Detailed Results</h2>';
            questions.forEach((q, i) => {
                const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
                const isCorrect = selected && selected.value === q.correct;
                if (isCorrect) score++;
                html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
            });
            document.querySelector('.score-circle').textContent = score + '/' + questions.length;
            document.getElementById('answer-key').innerHTML = html;
            document.getElementById('quiz-form').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
