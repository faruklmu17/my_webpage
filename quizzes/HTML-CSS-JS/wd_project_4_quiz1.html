<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML, CSS, and JS Concepts Quiz | Web Dev Project 4</title>
    <meta name="description"
        content="Test your knowledge of web development fundamentals with this 10-question quiz covering forms, select elements, CSS margins, and DOM manipulation.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../shared/quiz-style.css">
</head>

<body>

    <h1>🌐 Web Dev Project 4 Quiz</h1>

    <div class="quiz-container">
        <a href="../../resources/resources.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to
            Resources</a>
        <div class="intro">
            <p>Test your knowledge of web development fundamentals covering forms, select elements, CSS margins, and DOM
                manipulation.</p>
        </div>

        <div class="progress-wrapper">
            <div class="progress-container">
                <div id="progress-fill"></div>
            </div>
            <div id="progress-count">0/10 answered</div>
        </div>

        <form id="quiz-form">
            <div id="quiz-area"></div>
            <button type="button" id="submitBtn" onclick="submitQuiz()">Submit Results</button>
        </form>

        <div id="results">
            <div class="score-container">
                <div class="score-circle">0</div>
                <div class="score-label">Your Score</div>
            </div>
            <div class="feedback"></div>
            <div class="action-buttons">
                <a href="" class="secondary-btn" onclick="location.reload(); return false;"><i class="fas fa-redo"></i>
                    Retake Quiz</a>
                <a href="../../resources/resources.html" class="secondary-btn"><i class="fas fa-th-list"></i> More
                    Quizzes</a>
            </div>
            <div id="answer-key" class="answer-key"></div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "1. What is the purpose of the <form> element in this project?", options: ["a) To create a table layout", "b) To define a group of checkboxes", "c) To group the snack and drink selection elements", "d) To submit data to a server"], correct: "D", explanation: "The <form> element is used to submit data to a server." },
            {
                q: "2. What does the onchange attribute do in the <select> element?", options: ["a) It changes the background color", "b) It calls the snackSelection() function when the selection changes", "c) It prevents the user from changing selection", "d) It automatically submits"], correct: "B", explanation: "The onchange attribute triggers a function when the user selection changes."
            },
            { q: "3. What will happen when a user selects a snack?", options: ["a) The page reloads", "b) The selection is displayed in the paragraph with id 'snack-select'", "c) The drink selection changes", "d) An alert appears"], correct: "B", explanation: "The UI updates the snack selection text dynamically." },
            { q: "4. In CSS, what does 'margin: 0 auto;' do for a block element with defined width?", options: ["a) Centers it horizontally", "b) Removes all margins", "c) Makes it responsive", "d) Adds extra spacing"], correct: "A", explanation: "This centers the element within its container." },
            { q: "5. What is the default value of a dropdown when the page loads if no 'selected' attribute is set?", options: ["a) Null", "b) The first option listed", "c) Random", "d) Empty"], correct: "B", explanation: "The browser defaults to the first option." },
            { q: "6. What happens if the selection update function (JavaScript) is removed?", options: ["a) The page won't load", "b) The selection won't update dynamically", "c) The form will disappear", "d) The CSS will break"], correct: "B", explanation: "The dynamic behavior depends on the JS function." },
            { q: "7. Which JS property/method is used to update element content?", options: ["a) document.write()", "b) .innerHTML", "c) console.log()", "d) prompt()"], correct: "B", explanation: "innerHTML is used to get or set the HTML content of an element." },
            { q: "8. What type of input element is <select>?", options: ["a) Text field", "b) Radio buttons", "c) Dropdown menu", "d) Button"], correct: "C", explanation: "<select> creates a dropdown menu." },
            { q: "9. Why might you use <strong> inside a JS update statement?", options: ["a) To bold the output text", "b) To store a variable", "c) To change color", "d) To clear the form"], correct: "A", explanation: "It makes the displayed selected value more prominent." },
            { q: "10. What appears if 'Other' is selected from a dropdown with that option?", options: ["a) Error", "b) The text 'Other'", "c) Nothing", "d) A popup"], correct: "B", explanation: "The value of the option is passed to the output." }
        ];

        const quizArea = document.getElementById("quiz-area");
        questions.forEach((q, i) => {
            const div = document.createElement("div");
            div.className = "question";
            div.innerHTML = `<h3>${q.q}</h3><div class="options">` +
                q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0).toUpperCase()}"> ${opt}</label>`).join("") +
                `</div>`;
            quizArea.appendChild(div);
        });

        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
                document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
                document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
            });
        });

        function submitQuiz() {
            let score = 0;
            let html = '<h2>Detailed Results</h2>';
            questions.forEach((q, i) => {
                const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
                const isCorrect = selected && selected.value === q.correct;
                if (isCorrect) score++;
                html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
            });
            document.querySelector('.score-circle').textContent = score + '/' + questions.length;
            document.getElementById('answer-key').innerHTML = html;
            document.getElementById('quiz-form').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>

</html>
