<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Arrays & Functions Quiz | Web Dev Project 5</title>
  <meta name="description"
    content="Test your knowledge of JavaScript arrays, loops, and functions with this interactive quiz. 10 challenging coding concepts and behaviors.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../shared/quiz-style.css">
  <style>
    pre {
      background-color: #f8f9fa;
      padding: 12px;
      border-radius: 5px;
      border-left: 3px solid var(--primary-color);
      font-family: Consolas, Monaco, monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 15px 0;
    }
  </style>
</head>

<body>

  <h1>🚀 JS Arrays & Functions Quiz</h1>

  <div class="quiz-container">
    <a href="../../resources/resources.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Resources</a>
    <div class="intro">
      <p>Test your knowledge of JavaScript arrays, loops, and functions. Can you predict the output of these code
        snippets?</p>
    </div>

    <div class="progress-wrapper">
      <div class="progress-container">
        <div id="progress-fill"></div>
      </div>
      <div id="progress-count">0/10 answered</div>
    </div>

    <form id="quiz-form">
      <div id="quiz-area"></div>
      <button type="button" id="submitBtn" onclick="submitQuiz()">Submit Results</button>
    </form>

    <div id="results">
      <div class="score-container">
        <div class="score-circle">0</div>
        <div class="score-label">Your Score</div>
      </div>
      <div class="feedback"></div>
      <div class="action-buttons">
        <a href="" class="secondary-btn" onclick="location.reload(); return false;"><i class="fas fa-redo"></i> Retake
          Quiz</a>
        <a href="../../resources/resources.html" class="secondary-btn"><i class="fas fa-th-list"></i> More Quizzes</a>
      </div>
      <div id="answer-key" class="answer-key"></div>
    </div>
  </div>

  <script>
    const questions = [
      { q: "1. What will be the output?", code: `let sum = 0;\nfor (let i = 1; i <= 5; i++) {\n    sum += i;\n}\nconsole.log(sum);`, options: ["A) 10", "B) 15", "C) 5", "D) 20"], correct: "B", explanation: "The loop sums numbers 1 to 5: 1+2+3+4+5 = 15." },
      { q: "2. What is the output of this while loop?", code: `let i = 0;\nwhile (i < 3) {\n    console.log(i);\n    i++;\n}`, options: ["A) 0 1 2", "B) 0 1", "C) 1 2 3", "D) 1 2"], correct: "A", explanation: "Logs 0, 1, 2. Stops when i reaches 3." },
      { q: "3. What is the output?", code: `let i = 0;\nfor (i = 0; i < 3; i++) {\n    console.log(i);\n    while (i == 1) {\n        console.log("Inside");\n        break;\n    }\n}`, options: ["A) 0 1 Inside 2", "B) 0 1 2 Inside", "C) 0 1 2", "D) 0 Inside 2"], correct: "A", explanation: "The inside while loop runs once when i is 1." },
      { q: "4. What is the output?", code: `let str = "apple,banana,cherry";\nlet arr = str.split(",");\nconsole.log(arr);`, options: ["A) [\"apple\", \"banana\", \"cherry\"]", "B) [\"apple banana cherry\"]", "C) [\"apple,banana,cherry\"]", "D) [\"apple\", \"banana\", \"cherry\", \"\"]"], correct: "A", explanation: "split(',') breaks the string at each comma into an array." },
      { q: "5. Which joins [\"apple\", \"banana\"] into \"apple-banana\"?", options: ["A) arr.join(\" \")", "B) arr.join(\"-\")", "C) arr.split(\"-\")", "D) arr.join(\",\")"], correct: "B", explanation: "join('-') concatenates elements with a hyphen." },
      { q: "6. What is the result?", code: `let arr = [1, 2, 3, 4, 5];\narr[3] = 10;\nconsole.log(arr);`, options: ["A) [1, 2, 3, 10, 5]", "B) [1, 2, 3, 4, 5, 10]", "C) [1, 2, 3, 4, 5, 6]", "D) [10, 2, 3, 4, 5]"], correct: "A", explanation: "Array indexing starts at 0, so arr[3] is the 4th element." },
      { q: "7. Which correctly defines a function named 'greet'?", options: ["A) function greet() { ... }", "B) function greet() = { ... }", "C) function greet { ... }", "D) function greet(): { ... }"], correct: "A", explanation: "Standard function syntax: function name() { body }." },
      { q: "8. How do you call 'init()' when the page loads?", options: ["A) <body onload='init()'>", "B) window.onload = init();", "C) init()", "D) <init onload='true'>"], correct: "A", explanation: "The onload event attribute triggers when the document has loaded." },
      { q: "9. Why does this create an infinite loop?", code: `let i = 0;\nfor (i = 0; i < 10;) {\n    console.log(i);\n}`, options: ["A) Condition is wrong", "B) Increment (i++) is missing", "C) i is not defined", "D) Needs a break"], correct: "B", explanation: "Without i++, the condition i < 10 remains true forever." },
      { q: "10. What is wrong with this code?", code: `let t = \"apple-banana\";\nlet r = t.split(\"-\");\nconsole.log(r);`, options: ["A) Nothing, it works", "B) Incorrect method", "C) Should use space", "D) Dash is invalid"], correct: "A", explanation: "Split works perfectly with hyphens or any specified string delimiter." }
    ];

    const quizArea = document.getElementById("quiz-area");
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      let codeHtml = q.code ? `<pre><code>${q.code}</code></pre>` : '';
      div.innerHTML = `<h3>${q.q}</h3>${codeHtml}<div class="options">` +
        q.options.map((opt, idx) => `<label><input type="radio" name="q${i + 1}" value="${opt.charAt(0).toUpperCase()}"> ${opt}</label>`).join("") +
        `</div>`;
      quizArea.appendChild(div);
    });

    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const answered = questions.filter((_, i) => document.querySelector(`input[name="q${i + 1}"]:checked`)).length;
        document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';
        document.getElementById('progress-count').textContent = answered + '/' + questions.length + ' answered';
      });
    });

    function submitQuiz() {
      let score = 0;
      let html = '<h2>Detailed Results</h2>';
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i + 1}"]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        html += `<div class="answer-item ${isCorrect ? 'correct' : 'incorrect'}">
          <strong>Question ${i + 1}:</strong> ${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}<br>
          <p>${q.q}</p>
          <p>Your answer: ${selected ? selected.value : 'None'}</p>
          <p>Correct Answer: (${q.correct})</p>
          <p><em>${q.explanation}</em></p>
        </div>`;
      });
      document.querySelector('.score-circle').textContent = score + '/' + questions.length;
      document.getElementById('answer-key').innerHTML = html;
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>

</html>
