name: Sync to Hugging Face Hub

on:
  push:
    branches: [main, master, v1]
    paths:
      - 'ai_chatbot/hf_deployment/**'
      - 'mcp_server/**'
      - 'tutoring/**'
      - 'index.html'

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Target Hub space (username/space_name)
          HF_SPACE: hasanfaruk25/faruk-assistant
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is missing or empty in GitHub repository secrets! Please set it in Settings -> Secrets and variables -> Actions with a Hugging Face 'Write' access token."
            exit 1
          fi

          echo "Syncing to Hugging Face Space: $HF_SPACE"
          
          # Configure git
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # Clone the target space
          git clone https://hasanfaruk25:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE space_repo
          
          # Clean destination directory (preserve git, README, gitattributes)
          cd space_repo
          find . -maxdepth 1 -not -name '.git' -not -name '.' -not -name '..' -not -name 'README.md' -not -name '.gitattributes' -exec rm -rf {} +
          
          # Copy deployment files, MCP tools, and authoritative website pages
          cp -r ../ai_chatbot/hf_deployment/* .
          cp -r ../mcp_server .
          cp -r ../tutoring .
          cp ../index.html .
          
          # Commit and push
          git add .
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync from GitHub: ${{ github.sha }}"
            # Set remote URL with token explicitly
            git remote set-url origin https://hasanfaruk25:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE
            git push origin main
          fi
