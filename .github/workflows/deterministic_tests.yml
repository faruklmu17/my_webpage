name: Deterministic Quality & Guardrail Tests

on:
  push:
    branches: [main, master, v1, feature/langgraph-workflow, feature/langsmith-tests, 'feature/**']
    paths:
      - 'agent/**'
      - 'ai_chatbot/**'
      - 'mcp_server/**'
      - 'tutoring/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/deterministic_tests.yml'
  pull_request:
    branches: [main, master, v1]
  workflow_dispatch:

jobs:
  test-deterministic:
    name: Run Deterministic Unit & Guardrail Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest beautifulsoup4 requests numpy scikit-learn sentence-transformers gradio fastapi python-dotenv langgraph langchain-core "langsmith>=0.10.15"

      - name: Run Deterministic Test Suite
        env:
          DEEPEVAL_TELEMETRY_OPT_OUT: "1"
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: "faruk-assistant-evals"
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m pytest -v \
            tests/mcp/test_mcp_parsers.py \
            tests/agent/ \
            tests/ai/test_guardrail_logic.py \
            tests/ai/test_deterministic_checks.py
